<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista Employment Registry</title>
    <style>
        /* Forces the absolute viewport boundaries to align flawlessly */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1d24; /* Seamless dark backdrop matching your UI */
        }

        body {
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* ✨ FIX: Centering Engine Blueprint */
            display: flex;
            justify-content: center; /* Horizontally centers the card */
            align-items: center;     /* Vertically centers the card */
            min-height: 100vh;       
            
            box-sizing: border-box;
            padding: 20px;
            user-select: none;
        }

        /* The core registry UI card box layout container */
        .registry-card {
            width: 100%;
            max-width: 480px; /* Prevents it from stretching too wide on desktops */
            background-color: #232731;
            border: 2px solid #374151;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #ff9f0a;
            font-size: 22px;
            border-bottom: 2px solid #374151;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            background-color: #12141c;
            border: 1px solid #4b5563;
            border-radius: 6px;
            padding: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        .faded-hint-text {
            font-size: 13px;
            color: rgba(156, 163, 175, 0.35);
            font-style: italic;
            margin-top: 2px;
        }

        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        /* 🔒 THE DYNAMIC CONTINUATION BUTTON */
        .btn-continue {
            width: 100%;
            background-color: rgba(255, 159, 10, 0.15); 
            color: rgba(243, 244, 246, 0.25);          
            border: 1px dashed rgba(255, 159, 10, 0.3);
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 15px;
            box-sizing: border-box;
            text-align: center;
            cursor: not-allowed;
            pointer-events: none; 
            transition: all 0.3s ease-in-out;
        }

        /* ✨ UNLOCKED STATE ACCENTS */
        .btn-continue.unlocked {
            background-color: #ff9f0a !important;
            color: #000000 !important;
            border: none !important;
            cursor: pointer !important;
            pointer-events: auto !important; 
            box-shadow: 0 4px 14px rgba(255, 159, 10, 0.4);
        }

        .btn-continue.unlocked:hover {
            background-color: #e08b04 !important;
            transform: scale(1.01);
        }

        #badge-output {
            margin-top: 25px;
            background-color: #12141c;
            border: 1px dashed #ff9f0a;
            border-radius: 8px;
            padding: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="registry-card">
        <h2>Shift Registry File</h2>
        
        <div class="form-group">
            <label for="username">Staff Name:</label>
            <input type="text" id="username" placeholder="E.g. Zack" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="birthplace">Place of Birth:</label>
            <input type="text" id="birthplace" placeholder="E.g. London" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Registry Time Metric:</label>
            <div id="dynamic-date" class="faded-hint-text">System calculating DOB placeholder...</div>
        </div>

        <div class="form-group">
            <label for="coffeename">Coffee Name Alias:</label>
            <input type="text" id="coffeename" placeholder="E.g. Espresso King" autocomplete="off">
        </div>

        <!-- Lock Button -->
        <button class="btn-submit" onclick="generateStaffBadge()">Lock File & Start Shift</button>

        <!-- 🎯 FADED CONTINUE TRIGGER ELEMENT -->
        <div id="continue-link-btn" class="btn-continue" onclick="advanceToGameFloor()">
            Continue ➔
        </div>

        <!-- Receipt Feedback Console Area -->
        <div id="badge-output">
            <span style="color:#ff9f0a; font-weight:bold; font-size:12px; text-transform:uppercase;">Verified Profile Locked:</span>
            <p style="margin: 8px 0 4px 0; font-size:15px;" id="output-line-1"></p>
            <p style="margin: 0; font-size:13px; color:#9ca3af;" id="output-line-2"></p>
        </div>
    </div>

    <script>
        // Key matching index saving parameters
        const SAVE_PREFIX = 'hollow_cafe_slot_';

        window.onload = function() {
            generateRandomDOB();
        };

        function generateRandomDOB() {
            const startYear = 1985;
            const endYear = 2005;
            const randomYear = Math.floor(Math.random() * (endYear - startYear + 1)) + startYear;
            const randomMonth = Math.floor(Math.random() * 12) + 1;
            const randomDay = Math.floor(Math.random() * 28) + 1;
            
            const formattedDate = `${randomDay.toString().padStart(2, '0')}/${randomMonth.toString().padStart(2, '0')}/${randomYear}`;
            document.getElementById('dynamic-date').innerText = `DOB Auto-Generated: ${formattedDate} (Faded Verification Token)`;
        }

        function generateStaffBadge() {
            const name = document.getElementById('username').value.trim();
            const place = document.getElementById('birthplace').value.trim();
            const coffeeAlias = document.getElementById('coffeename').value.trim();

            if (!name || !place || !coffeeAlias) {
                alert("🔒 Access Denied: You must complete Staff Name, Place of Birth, and Coffee Name entries before locking profiles.");
                return;
            }

            const outputBox = document.getElementById('badge-output');
            document.getElementById('output-line-1').innerHTML = `Welcome to the grid, <strong>${name}</strong> [Alias: <em>${coffeeAlias}</em>]`;
            document.getElementById('output-line-2').innerHTML = `📍 Origin Verified: ${place} | Security clearance approved.`;
            outputBox.style.display = 'block';

            // Reads the slot number index passed over from the menu file
            const activeSlot = localStorage.getItem('hollow_cafe_current_configuring_slot') || '1';
            const slotKey = SAVE_PREFIX + activeSlot;

            // Bundle data object parameters to commit safely to LocalStorage
            const newGameData = {
                name: name,
                birthplace: place,
                alias: coffeeAlias,
                day: 1,
                timestamp: new Date().toLocaleDateString()
            };
            localStorage.setItem(slotKey, JSON.stringify(newGameData));

            // Activate Continue trigger mapping
            const continueBtn = document.getElementById('continue-link-btn');
            continueBtn.classList.add('unlocked');
            continueBtn.innerText = "Continue to Game Floor ➔";
        }

        function advanceToGameFloor() {
            const activeSlot = localStorage.getItem('hollow_cafe_current_configuring_slot') || '1';
            alert(`Profile Complete! Moving into the shift zone on slot ${activeSlot}...`);
            // window.location.href = 'gamefloor.html?slot=' + activeSlot;
        }
    </script>
</body>
</html>
