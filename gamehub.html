<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe - House Floor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #b91c1c;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameContainer {
            width: 800px;
            background: #000;
            border: 3px solid #450a0a;
            box-shadow: 0 0 40px rgba(185, 28, 28, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HUD PANEL */
        .hud-banner {
            background-color: #110000;
            border-bottom: 2px solid #450a0a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .hud-item {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-value {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* CORE CANVAS VIEWPORT WRAPPER */
        .viewport-wrapper {
            position: relative;
            width: 794px;
            height: 450px;
            overflow: hidden;
            background-color: #08080a;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* CONSOLE BOX FEEDBACK SYSTEM */
        .dialogue-box {
            height: 110px;
            background-color: #0a0000;
            border-top: 2px solid #450a0a;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
        }

        .dialogue-speaker {
            font-size: 0.9rem;
            color: #ff9f0a;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dialogue-text {
            font-size: 1rem;
            color: #f3f4f6;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        
        <!-- DATA HUD BAR -->
        <div class="hud-banner">
            <div class="hud-item">LOCATION: <span class="hud-value" style="color: #ff9f0a;">4-ROOM RESIDENCE</span></div>
            <div class="hud-item">CLOCK METRIC: <span id="hud-time" class="hud-value">01:05 AM</span></div>
            <div class="hud-item">THREAT SECTOR: <span id="hud-threat" class="hud-value" style="color: #22c55e;">STABLE</span></div>
        </div>

        <div class="viewport-wrapper">
            <!-- SURVIVAL GRID LAYER CANVAS -->
            <canvas id="gameCanvas" width="794" height="450"></canvas>
        </div>

        <!-- NOTIFICATION DIALOGUE BAR CONTAINER -->
        <div class="dialogue-box">
            <div id="dialogueSpeaker" class="dialogue-speaker">LOG CONSOLE</div>
            <div id="dialogueText" class="dialogue-text">Explore the house using WASD keys. Aim your flashlight with the mouse. Walk up to objects to examine them.</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let loopId = null;

        // Player configurations starting metrics centered inside our cottage bedroom
        let player = { x: 100, y: 100, size: 14, speed: 2.8, angle: 0 };
        
        // 🧱 BIRDS-EYE STRUCTURAL INTERIOR WALLS (x, y, width, height)
        let houseWalls = [
            // Boundary Outer Walls limits
            { x: 20, y: 20, w: 754, h: 12 },   // Top boundary wall
            { x: 20, y: 418, w: 754, h: 12 },  // Bottom boundary wall
            { x: 20, y: 20, w: 12, h: 410 },   // Left boundary wall
            { x: 762, y: 20, w: 12, h: 410 },  // Right boundary wall
            
            // Interior Room Dividers (with cutouts left open for doors)
            { x: 240, y: 20, w: 12, h: 150 },  // Bedroom wall top branch
            { x: 240, y: 230, w: 12, h: 200 }, // Bedroom wall bottom branch
            
            { x: 240, y: 230, w: 260, h: 12 }, // Central hallway horizontal wall divider
            { x: 500, y: 230, w: 12, h: 200 }  // Bathroom/Kitchen divider vertical axis
        ];
        
        // 🪑 HOUSE FURNITURE LAYOUT BLOCKS MAP INDEX
        let houseFurniture = [
            // Bedroom Objects (Top-Left)
            { x: 45, y: 45, w: 80, h: 65, color: '#3f3f46', label: 'Couch Bed' },
            { x: 190, y: 45, w: 40, h: 40, color: '#4c1d95', label: 'Static Television Anomaly' },
            
            // Living Room Objects (Bottom-Left / Center corridor)
            { x: 50, y: 320, w: 140, h: 50, color: '#7f1d1d', label: 'Long Leather Sofa' },
            { x: 100, y: 265, w: 40, h: 40, color: '#78350f', label: 'Coffee Table' },
            
            // Kitchen Objects (Top-Right Area)
            { x: 380, y: 45, w: 160, h: 35, color: '#1e293b', label: 'Kitchen Marble Counter Countertop' },
            { x: 670, y: 45, w: 60, h: 60, color: '#475569', label: 'Industrial Refrigerator Unit' },
            { x: 420, y: 130, w: 80, h: 60, color: '#b45309', label: 'Wooden Dining Table' },
            
            // Bathroom Objects (Bottom-Right Area)
            { x: 700, y: 350, w: 50, h: 55, color: '#e2e8f0', label: 'Porcelain Bath Station' },
            { x: 530, y: 375, w: 40, h: 35, color: '#cbd5e1', label: 'Utility Sink Base' }
        ];

        let keys = { w: false, a: false, s: false, d: false };
        let mouse = { x: 0, y: 0 };

        function setConsoleLog(speaker, text) {
            document.getElementById('dialogueSpeaker').innerText = speaker.toUpperCase();
            document.getElementById('dialogueText').innerText = text;
        }

        // AUTO-START UP INITIALIZER ROUTINE
        window.onload = function() {
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            canvas.addEventListener('mousemove', handleMouseMove);

            setConsoleLog("HOUSE ENTRIES", "WASD keys move your character blueprint across the rooms grid. Sweep your MOUSE to focus the vision beam.");
            
            if (loopId) cancelAnimationFrame(loopId);
            loopId = requestAnimationFrame(houseEngineFrameCycle);
        };

        function handleKeyDown(e) {
            let key = e.key.toLowerCase();
            if (key in keys) { keys[key] = true; e.preventDefault(); }
        }
        function handleKeyUp(e) {
            let key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        }
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        }

        function houseEngineFrameCycle() {
            updatePlayerPhysicsVectors();
            renderHouseGraphicsLayers();
            loopId = requestAnimationFrame(houseEngineFrameCycle);
        }

        function updatePlayerPhysicsVectors() {
            let nextX = player.x;
            let nextY = player.y;

            if (keys.w) nextY -= player.speed;
            if (keys.s) nextY += player.speed;
            if (keys.a) nextX -= player.speed;
            if (keys.d) nextX += player.speed;

            // Check walls first, then verify furniture obstacle metrics bounds
            if (!evaluateWallCollisions(nextX, player.y) && !evaluateFurnitureCollisions(nextX, player.y)) {
                player.x = nextX;
            }
            if (!evaluateWallCollisions(player.x, nextY) && !evaluateFurnitureCollisions(player.x, nextY)) {
                player.y = nextY;
            }

            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        }

        function evaluateWallCollisions(x, y) {
            for (let wall of houseWalls) {
                if (x + player.size > wall.x && x - player.size < wall.x + wall.w &&
                    y + player.size > wall.y && y - player.size < wall.y + wall.h) {
                    return true;
                }
            }
            return false;
        }

        function evaluateFurnitureCollisions(x, y) {
            for (let obj of houseFurniture) {
                if (x + player.size > obj.x && x - player.size < obj.x + obj.w &&
                    y + player.size > obj.y && y - player.size < obj.y + obj.h) {
                    
                    if (obj.label.includes('Anomaly')) {
                        setConsoleLog("⚠️ MONTIOR SCREEN", "The television screen buzzes with static sound ripples... something is near.");
                        document.getElementById('hud-threat').innerText = "ALERT DETECTED";
                        document.getElementById('hud-threat').style.color = "#ef4444";
                    } else {
                        setConsoleLog("EXAMINE", `Checking object: [ ${obj.label} ]`);
                    }
                    return true;
                }
            }
            return false;
        }

        function renderHouseGraphicsLayers() {
            // 1. Core floor plane background backdrop
            ctx.fillStyle = '#060608';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Tile grid map coordinate gridlines
            ctx.strokeStyle = '#0f0f12';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
