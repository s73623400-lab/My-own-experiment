<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe - House Floor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #b91c1c;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameContainer {
            width: 800px;
            background: #000;
            border: 3px solid #450a0a;
            box-shadow: 0 0 40px rgba(185, 28, 28, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HUD PANEL */
        .hud-banner {
            background-color: #110000;
            border-bottom: 2px solid #450a0a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .hud-item {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-value {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* CORE CANVAS VIEWPORT WRAPPER */
        .viewport-wrapper {
            position: relative;
            width: 794px;
            height: 450px;
            overflow: hidden;
            background-color: #08080a;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* INTERACTION TITLE SCREEN TERMINAL OVERLAY */
        #interactionScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
            padding: 30px;
        }

        .menu-title {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #b91c1c;
        }

        .menu-btn {
            background: #1a0202;
            border: 2px solid #b91c1c;
            color: #b91c1c;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background: #b91c1c;
            color: #000000;
            box-shadow: 0 0 25px #b91c1c;
        }

        /* CONSOLE BOX FEEDBACK SYSTEM */
        .dialogue-box {
            height: 110px;
            background-color: #0a0000;
            border-top: 2px solid #450a0a;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
        }

        .dialogue-speaker {
            font-size: 0.9rem;
            color: #ff9f0a;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dialogue-text {
            font-size: 1rem;
            color: #f3f4f6;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        
        <!-- DATA HUD BAR -->
        <div class="hud-banner">
            <div class="hud-item">LOCATION: <span class="hud-value" style="color: #ff9f0a;">SAFE HOUSE</span></div>
            <div class="hud-item">CLOCK METRIC: <span id="hud-time" class="hud-value">01:00 AM</span></div>
            <div class="hud-item">THREAT SECTOR: <span id="hud-threat" class="hud-value" style="color: #22c55e;">STABLE</span></div>
        </div>

        <div class="viewport-wrapper">
            
            <!-- INTERACTIVE POP-UP MODAL PANEL (Guaranteed Click Trigger Engine) -->
            <div id="interactionScreen">
                <h1 id="screenTitle" class="menu-title">THE HOLLOW CAFE</h1>
                <p id="screenDesc" style="color: #9ca3af; max-width: 600px;">Wake up. You have an urgent shift configuration files request pending on your terminal board layout structures.</p>
                <button id="screenActionBtn" class="menu-btn" onclick="bootSmallHouseEngine()">Clock In</button>
            </div>

            <!-- SURVIVAL GRID LAYER CANVAS -->
            <canvas id="gameCanvas" width="794" height="450"></canvas>
        </div>

        <!-- NOTIFICATION DIALOGUE BAR CONTAINER -->
        <div class="dialogue-box">
            <div id="dialogueSpeaker" class="dialogue-speaker">LOG CONSOLE</div>
            <div id="dialogueText" class="dialogue-text">System operational. Click "Clock In" to load your house map workspace structures directly.</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let isEngineRunning = false;
        let loopId = null;

        // Player configurations starting metrics centered inside our cottage bedroom
        let player = { x: 150, y: 220, size: 12, speed: 3.0, angle: 0 };
        
        // Static Furniture Obstructions Layout blueprint mapping coordinates inside your small house
        let mapObjects = [
            { x: 380, y: 140, w: 70, h: 140, color: '#78350f', label: 'Wooden Dining Table' },
            { x: 100, y: 60, w: 120, h: 50, color: '#3f3f46', label: 'Cozy Couch Bed' },
            { x: 650, y: 50, w: 60, h: 60, color: '#4c1d95', label: 'Static Television Anomaly' }
        ];

        let keys = { w: false, a: false, s: false, d: false };
        let mouse = { x: 0, y: 0 };

        function setConsoleLog(speaker, text) {
            document.getElementById('dialogueSpeaker').innerText = speaker.toUpperCase();
            document.getElementById('dialogueText').innerText = text;
        }

        // TRIGGER METHOD SWITCHING PANELS TO LOAD LIVE GAME MAP INSTANTLY ON CLICKS
        function bootSmallHouseEngine() {
            document.getElementById('interactionScreen').style.display = 'none';
            isEngineRunning = true;
            
            // Wire tracking event listeners directly to window frame engines
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            canvas.addEventListener('mousemove', handleMouseMove);

            setConsoleLog("HOUSE DIARY", "Your smartphone buzzes on the nightstand. Use WASD to navigate and check your furniture. Sweeping your MOUSE aims your flashlight beam.");
            
            if (loopId) cancelAnimationFrame(loopId);
            loopId = requestAnimationFrame(houseEngineFrameCycle);
        }

        function handleKeyDown(e) {
            let key = e.key.toLowerCase();
            if (key in keys) { keys[key] = true; e.preventDefault(); }
        }
        function handleKeyUp(e) {
            let key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        }
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        }

        // MAIN RECURSIVE PHYSICS ANIMATION LOOPS CORE WHEEL
        function houseEngineFrameCycle() {
            if (!isEngineRunning) return;

            updatePlayerPhysicsVectors();
            renderHouseGraphicsLayers();

            loopId = requestAnimationFrame(houseEngineFrameCycle);
        }

        function updatePlayerPhysicsVectors() {
            let nextX = player.x;
            let nextY = player.y;

            if (keys.w) nextY -= player.speed;
            if (keys.s) nextY += player.speed;
            if (keys.a) nextX -= player.speed;
            if (keys.d) nextX += player.speed;

            // Constrain avatar directly inside absolute map exterior walls boundaries metrics
            if (nextX > player.size && nextX < canvas.width - player.size) {
                if (!evaluateFurnitureCollisions(nextX, player.y)) player.x = nextX;
            }
            if (nextY > player.size && nextY < canvas.height - player.size) {
                if (!evaluateFurnitureCollisions(player.x, nextY)) player.y = nextY;
            }

            // Continuous calculation of head perspective orientation pointing towards pointing mouse dots
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        }

        function evaluateFurnitureCollisions(x, y) {
            for (let obj of mapObjects) {
                if (x + player.size > obj.x && x - player.size < obj.x + obj.w &&
                    y + player.size > obj.y && y - player.size < obj.y + obj.h) {
                    
                    if (obj.label.includes('Anomaly')) {
                        setConsoleLog("⚠️ RADAR BLIP", "The screen hums with white noise. An unnatural draft fills the bedroom corridors.");
                        document.getElementById('hud-threat').innerText = "ANOMALY INBOUND";
                        document.getElementById('hud-threat').style.color = "#ef4444";
                    } else {
                        setConsoleLog("INTERACTION", `Approaching your house asset structures: [${obj.label}]. Path blocked.`);
                    }
                    return true;
                }
            }
            return false;
        }

        function renderHouseGraphicsLayers() {
