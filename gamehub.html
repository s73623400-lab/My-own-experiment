<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe - System Floor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #b91c1c;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameContainer {
            width: 800px;
            background: #000;
            border: 3px solid #450a0a;
            box-shadow: 0 0 40px rgba(185, 28, 28, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HUD PANEL */
        .hud-banner {
            background-color: #110000;
            border-bottom: 2px solid #450a0a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .hud-item {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-value {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* CORE VIEWPORT WRAPPER */
        .viewport-wrapper {
            position: relative;
            width: 794px;
            height: 450px;
            overflow: hidden;
            background-color: #08080a;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none; /* ⚡ IGNORES INTERACTION DETECTIONS DURING OVERLAYS */
        }

        /* 💵 DAY SHIFT DASHBOARD OVERLAY */
        #dayShiftUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #141517;
            z-index: 50; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #f3f4f6;
            pointer-events: auto;
        }

        .register-box {
            background-color: #1f232b;
            border: 2px solid #374151;
            padding: 30px;
            border-radius: 8px;
            width: 80%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .register-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .register-btn:hover {
            background-color: #1d4ed8;
            transform: scale(1.02);
        }

        /* 🚨 UNBREAKABLE SCREEN POP-UP CARD LAYER */
        #interactionScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999999 !important; /* Forces it over all invisible walls */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
            padding: 30px;
            pointer-events: auto !important; /* Grants full clickable processing rights */
        }

        .menu-title {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #b91c1c;
        }

        /* 🎯 ROCK-SOLID INTERACTIVE BUTTON SCHEMES */
        .menu-btn {
            background: #1a0202 !important;
            border: 2px solid #b91c1c !important;
            color: #b91c1c !important;
            padding: 14px 40px !important;
            font-size: 1.2rem !important;
            font-weight: bold !important;
            cursor: pointer !important;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.2s;
            position: relative;
            z-index: 1000000 !important; /* Maximizes layers stack index completely */
            pointer-events: auto !important; /* Guarantees mouse hits will register */
        }

        .menu-btn:hover {
            background: #b91c1c !important;
            color: #000000 !important;
            box-shadow: 0 0 25px #b91c1c;
        }

        /* CONSOLE FEEDBACK BOX */
        .dialogue-box {
            height: 110px;
            background-color: #0a0000;
            border-top: 2px solid #450a0a;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
        }

        .dialogue-speaker {
            font-size: 0.9rem;
            color: #ff9f0a;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dialogue-text {
            font-size: 1rem;
            color: #f3f4f6;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        
        <!-- DATA HUD BAR -->
        <div class="hud-banner">
            <div class="hud-item">CALENDAR: <span id="hud-day" class="hud-value">DAY 1</span></div>
            <div class="hud-item">CLOCK METRIC: <span id="hud-time" class="hud-value">08:00 AM</span></div>
            <div class="hud-item">SHIFT INCOME: <span id="hud-money" class="hud-value" style="color: #22c55e;">$0.00</span></div>
        </div>

        <div class="viewport-wrapper">
            
            <!-- 🚨 INTERACTIVE TRANSITION MODAL (Completely unblocked) -->
            <div id="interactionScreen">
                <h1 id="screenTitle" class="menu-title">THE HOLLOW CAFE</h1>
                <p id="screenDesc" style="color: #9ca3af; max-width: 600px;">Welcome to your first morning shift assignment.</p>
                <button id="screenActionBtn" class="menu-btn" onclick="advanceWorkflowState()">Clock In</button>
            </div>

            <!-- 💵 DAYTIME SHIFT CASH REGISTER UI INTERFACE -->
            <div id="dayShiftUI" style="display: none;">
                <div class="register-box">
                    <h2 style="color: #ff9f0a; margin-bottom: 10px; font-size: 1.4rem;">POS TERMINAL</h2>
                    <p id="orderDeskText" style="margin-bottom: 15px; min-height: 40px; font-style: italic;">Waiting for patrons...</p>
                    <button id="orderProcessBtn" class="register-btn" onclick="processRegisterOrder()">Process Register Order</button>
                </div>
            </div>

            <!-- 🔦 NIGHTTIME 2D CANVAS MATRIX VIEWPORT -->
            <canvas id="gameCanvas" width="794" height="450"></canvas>
        </div>

        <!-- CONSOLE FEEDBACK BOX -->
        <div class="dialogue-box">
            <div id="dialogueSpeaker" class="dialogue-speaker">LOG CONSOLE</div>
            <div id="dialogueText" class="dialogue-text">System operational. Click "Clock In" to begin your regular workflow logs.</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const SAVE_PREFIX = 'hollow_cafe_slot_';
        let currentProfile = { name: "Zack", alias: "Espresso King" };

        // CORE RUNTIME STATE CONTROLLERS
        let gameDay = 1;
        let gameHour = 8;
        let isPm = false;
        let gameProfit = 0;
        let currentGameState = "START_MENU"; 

        // 2D Engine Physics variables
        let loopId = null;
        let player = { x: 120, y: 225, size: 12, speed: 2.8, angle: 0 };
        let anomalies = [
            { x: 520, y: 90, size: 11, speedX: 1.4, speedY: 1.0, color: '#ff0000' },
            { x: 620, y: 340, size: 14, speedX: -1.2, speedY: -1.6, color: '#ff0000' }
        ];
        let mapObjects = [
            { x: 340, y: 100, w: 40, h: 250, color: '#27272a', label: 'Bar Counter' },
            { x: 710, y: 200, w: 45, h: 50, color: '#eab308', label: 'Main Breaker Panel', fixed: false }
        ];
        let keys = { w: false, a: false, s: false, d: false };
        let mouse = { x: 0, y: 0 };

        window.onload = function() {
            let slotId = localStorage.getItem('hollow_cafe_current_configuring_slot') || '1';
            let raw = localStorage.getItem(SAVE_PREFIX + slotId);
            if (raw) currentProfile = JSON.parse(raw);
            
            document.getElementById('screenDesc').innerText = `Staff Logged: ${currentProfile.name.toUpperCase()} [Alias: ${currentProfile.alias.toUpperCase()}]. Welcome to your barista cycle logs.`;
        };

        function setConsoleLog(speaker, text) {
            document.getElementById('dialogueSpeaker').innerText = speaker.toUpperCase();
            document.getElementById('dialogueText').innerText = text;
        }

        // --- NARRATIVE WORKFLOW STATE ENGINE ---
        function advanceWorkflowState() {
            const modal = document.getElementById('interactionScreen');
            
            if (currentGameState === "START_MENU" || currentGameState === "NEXT_DAY_PENDING") {
                currentGameState = "DAY_SHIFT";
                modal.style.display = 'none';
                document.getElementById('dayShiftUI').style.display = 'flex';
                
                gameHour = 8;
                isPm = false;
                updateHudDisplays();
