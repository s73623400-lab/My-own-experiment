<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe - Test Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111116;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background-color: #000000;
            border: 4px solid #b91c1c; /* Blood red border link */
            box-shadow: 0 0 30px rgba(185, 28, 28, 0.4);
            display: block;
        }
    </style>
</head>
<body>

    <!-- Minimal stable rendering window canvas -->
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 🟢 PLAYER ENGINE BASE VALUES
        let player = {
            x: 400, // Starts dead-center horizontally
            y: 225, // Starts dead-center vertically
            radius: 15,
            speed: 4
        };

        // Key inputs state dictionary tracker
        let keys = {
            w: false,
            a: false,
            s: false,
            d: false
        };

        // RUNTIME LIFECYCLE INITIALIZER HOOKS
        window.onload = function() {
            // Bind movement listeners straight to your device keyboard handles
            window.addEventListener('keydown', (e) => {
                let key = e.key.toLowerCase();
                if (key in keys) keys[key] = true;
            });

            window.addEventListener('keyup', (e) => {
                let key = e.key.toLowerCase();
                if (key in keys) keys[key] = false;
            });

            // Start the core recursive processing animation cycle loops loop
            requestAnimationFrame(engineFrameUpdateLoop);
        };

        // 🧠 RECURSIVE ENGINE LOOP WHEEL
        function engineFrameUpdateLoop() {
            // 1. Process player axis updates tracking inputs matrix checks
            if (keys.w) player.y -= player.speed;
            if (keys.s) player.y += player.speed;
            if (keys.a) player.x -= player.speed;
            if (keys.d) player.x += player.speed;

            // 2. Prevent player circle token from running out off the screen boundaries margins
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

            // 3. Clear the frame buffer cleanly back to background black base colors
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 4. Draw basic navigation background matrix lines grids
            ctx.strokeStyle = '#222226';
            ctx.lineWidth = 1;
            const gridSpacing = 40;

            for (let i = 0; i < canvas.width; i += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            for (let j = 0; j < canvas.height; j += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(canvas.width, j);
                ctx.stroke();
            }

            // 5. Draw the player target blue circle token asset avatar
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#2563eb'; // High-visibility tech blue player node circle
            ctx.fill();
            ctx.strokeStyle = '#ffffff'; // Crisp white accent border line
            ctx.lineWidth = 2;
            ctx.stroke();

            // Run next sequential draw update cycle seamlessly
            requestAnimationFrame(engineFrameUpdateLoop);
        }
    </script>
</body>
</html>
