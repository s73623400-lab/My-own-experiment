<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe - Sprite Arena</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111116;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background-color: #000000;
            border: 4px solid #b91c1c; 
            box-shadow: 0 0 30px rgba(185, 28, 28, 0.4);
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Disable smoothing to make the dynamically drawn pixels crisp and retro
        ctx.imageSmoothingEnabled = false;

        // 👤 PLAYER SPRITE CONFIGURATION PARAMETERS
        let player = {
            x: 400,
            y: 225,
            width: 32,   // Sized up to look like a clean retro tile asset
            height: 36,
            speed: 4,
            isMoving: false,
            animTimer: 0,
            walkFrame: 0 // Toggles between 0 and 1 for alternating feet movement steps
        };

        let keys = { w: false, a: false, s: false, d: false };

        window.onload = function() {
            window.addEventListener('keydown', (e) => {
                let key = e.key.toLowerCase();
                if (key in keys) keys[key] = true;
            });

            window.addEventListener('keyup', (e) => {
                let key = e.key.toLowerCase();
                if (key in keys) keys[key] = false;
            });

            requestAnimationFrame(engineFrameUpdateLoop);
        };

        function engineFrameUpdateLoop() {
            player.isMoving = false;

            // Process movement inputs matrix
            if (keys.w) { player.y -= player.speed; player.isMoving = true; }
            if (keys.s) { player.y += player.speed; player.isMoving = true; }
            if (keys.a) { player.x -= player.speed; player.isMoving = true; }
            if (keys.d) { player.x += player.speed; player.isMoving = true; }

            // Hard boundary locks to contain sprite on the screen grid
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;

            // Process step cycle animation speeds timers
            if (player.isMoving) {
                player.animTimer++;
                if (player.animTimer > 12) { // Updates walking stance every 12 frames
                    player.walkFrame = player.walkFrame === 0 ? 1 : 0;
                    player.animTimer = 0;
                }
            } else {
                player.walkFrame = 0; // Standard standing pose when still
            }

            // --- RENDERING PIPELINE ---
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw dark room gridlines background matrix
            ctx.strokeStyle = '#222226';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // 🎯 DRAW RETRO CHARACTER AVATAR SPRITE BLOCK (Pixel-Art Engine Rendering)
            let px = player.x;
            let py = player.y;

            // 1. Black Hair Outlines (Left and Right sides of head)
            ctx.fillStyle = '#000000';
            ctx.fillRect(px + 4, py + 12, 4, 10);
            ctx.fillRect(px + 24, py + 12, 4, 10);

            // 2. Skin Face Base Layer
            ctx.fillStyle = '#fbcfe8'; // Peach-skin tone representation
            ctx.fillRect(px + 6, py + 10, 20, 16);

            // 3. Eyes Detailing
            ctx.fillStyle = '#000000';
            ctx.fillRect(px + 10, py + 14, 2, 4);
            ctx.fillRect(px + 20, py + 14, 2, 4);

            // 4. Overalls / Mustachio mouth area accent
            ctx.fillStyle = '#451a03';
            ctx.fillRect(px + 10, py + 20, 12, 2);

            // 5. Red Cap Brim Hat
            ctx.fillStyle = '#dc2626'; // Deep red dome cap matching your reference image
            ctx.fillRect(px + 4, py + 2, 24, 8);  // Main cap base
            ctx.fillRect(px + 2, py + 6, 28, 4);  // Cap extended side peak brim 

            // 6. Main Red Shirt Torso Chest Area
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(px + 4, py + 26, 24, 6);

            // 7. Blue Denim Overalls/Straps Layer Accent
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(px + 8, py + 26, 4, 6);  // Left overall strap block
            ctx.fillRect(px + 20, py + 26, 4, 6); // Right overall strap block
            ctx.fillRect(px + 8, py + 30, 16, 4); // Pants middle segment waistline

            // 8. Dynamic Walking Boot Steps Stances
            ctx.fillStyle = '#991b1b'; // Red-brown helper work boots
            if (player.walkFrame === 0) {
                // Stance 1: Standing / Left Foot Down
                ctx.fillRect(px + 6, py + 34, 6, 4);
                ctx.fillRect(px + 20, py + 34, 6, 4);
            } else {
                // Stance 2: Alternating Right Foot Walking Step Raised Profile
                ctx.fillRect(px + 6, py + 32, 6, 4);
                ctx.fillRect(px + 20, py + 34, 6, 4);
            }

            requestAnimationFrame(engineFrameUpdateLoop);
        }
    </script>
</body>
</html>
