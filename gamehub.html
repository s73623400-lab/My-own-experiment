<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe - House Floor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #b91c1c;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameContainer {
            width: 800px;
            background: #000;
            border: 3px solid #450a0a;
            box-shadow: 0 0 40px rgba(185, 28, 28, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HUD PANEL */
        .hud-banner {
            background-color: #110000;
            border-bottom: 2px solid #450a0a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .hud-item {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-value {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* CORE CANVAS VIEWPORT WRAPPER */
        .viewport-wrapper {
            position: relative;
            width: 794px;
            height: 450px;
            overflow: hidden;
            background-color: #08080a;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* CONSOLE BOX FEEDBACK SYSTEM */
        .dialogue-box {
            height: 110px;
            background-color: #0a0000;
            border-top: 2px solid #450a0a;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
        }

        .dialogue-speaker {
            font-size: 0.9rem;
            color: #ff9f0a;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dialogue-text {
            font-size: 1rem;
            color: #f3f4f6;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        
        <!-- DATA HUD BAR -->
        <div class="hud-banner">
            <div class="hud-item">LOCATION: <span class="hud-value" style="color: #ff9f0a;">SAFE HOUSE</span></div>
            <div class="hud-item">CLOCK METRIC: <span id="hud-time" class="hud-value">01:00 AM</span></div>
            <div class="hud-item">THREAT SECTOR: <span id="hud-threat" class="hud-value" style="color: #22c55e;">STABLE</span></div>
        </div>

        <div class="viewport-wrapper">
            <!-- SURVIVAL GRID LAYER CANVAS -->
            <canvas id="gameCanvas" width="794" height="450"></canvas>
        </div>

        <!-- NOTIFICATION DIALOGUE BAR CONTAINER -->
        <div class="dialogue-box">
            <div id="dialogueSpeaker" class="dialogue-speaker">LOG CONSOLE</div>
            <div id="dialogueText" class="dialogue-text">Move your red character with WASD keys. Aim your flashlight beam with the MOUSE cursor. Avoid touching the purple television anomaly...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let loopId = null;

        // Player configurations starting metrics centered inside our cottage bedroom
        let player = { x: 150, y: 220, size: 12, speed: 3.0, angle: 0 };
        
        // Static Furniture Obstructions Layout blueprint mapping coordinates inside your small house
        let mapObjects = [
            { x: 380, y: 140, w: 70, h: 140, color: '#78350f', label: 'Wooden Dining Table' },
            { x: 100, y: 60, w: 120, h: 50, color: '#3f3f46', label: 'Cozy Couch Bed' },
            { x: 650, y: 50, w: 60, h: 60, color: '#4c1d95', label: 'Static Television Anomaly' }
        ];

        let keys = { w: false, a: false, s: false, d: false };
        let mouse = { x: 0, y: 0 };

        function setConsoleLog(speaker, text) {
            document.getElementById('dialogueSpeaker').innerText = speaker.toUpperCase();
            document.getElementById('dialogueText').innerText = text;
        }

        // 🛡️ CRITICAL RUNTIME AUTO-START: Fires the game engine immediately without any buttons
        window.onload = function() {
            // Instantly wire movement trackers to your device
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            canvas.addEventListener('mousemove', handleMouseMove);

            setConsoleLog("HOUSE DIARY", "Your smartphone buzzes on the nightstand. WASD keys move your character circle. Sweeping your mouse targets your 🔦 light beam.");
            
            if (loopId) cancelAnimationFrame(loopId);
            loopId = requestAnimationFrame(houseEngineFrameCycle);
        };

        function handleKeyDown(e) {
            let key = e.key.toLowerCase();
            if (key in keys) { keys[key] = true; e.preventDefault(); }
        }
        function handleKeyUp(e) {
            let key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        }
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        }

        // MAIN RECURSIVE PHYSICS ANIMATION LOOPS CORE WHEEL
        function houseEngineFrameCycle() {
            updatePlayerPhysicsVectors();
            renderHouseGraphicsLayers();
            loopId = requestAnimationFrame(houseEngineFrameCycle);
        }

        function updatePlayerPhysicsVectors() {
            let nextX = player.x;
            let nextY = player.y;

            if (keys.w) nextY -= player.speed;
            if (keys.s) nextY += player.speed;
            if (keys.a) nextX -= player.speed;
            if (keys.d) nextX += player.speed;

            // Constrain avatar directly inside absolute map exterior walls boundaries metrics
            if (nextX > player.size && nextX < canvas.width - player.size) {
                if (!evaluateFurnitureCollisions(nextX, player.y)) player.x = nextX;
            }
            if (nextY > player.size && nextY < canvas.height - player.size) {
                if (!evaluateFurnitureCollisions(player.x, nextY)) player.y = nextY;
            }

            // Continuous calculation of head perspective orientation pointing towards pointing mouse dots
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        }

        function evaluateFurnitureCollisions(x, y) {
            for (let obj of mapObjects) {
                if (x + player.size > obj.x && x - player.size < obj.x + obj.w &&
                    y + player.size > obj.y && y - player.size < obj.y + obj.h) {
                    
                    if (obj.label.includes('Anomaly')) {
                        setConsoleLog("⚠️ RADAR BLIP", "The screen hums with white noise. An unnatural draft fills the bedroom corridors.");
                        document.getElementById('hud-threat').innerText = "ANOMALY INBOUND";
                        document.getElementById('hud-threat').style.color = "#ef4444";
                    } else {
                        setConsoleLog("INTERACTION", `Approaching your house asset structures: [${obj.label}]. Path blocked.`);
                    }
                    return true;
                }
            }
            return false;
        }

        function renderHouseGraphicsLayers() {
            // 1. Solid pitch floor backdrop configuration draw mapping actions
            ctx.fillStyle = '#060608';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Render subtle home tiling framework grids floor vectors lines
            ctx.strokeStyle = '#121215';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let j=0; j<canvas.height; j+=40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // 3. Render house structure shapes layouts blueprints onto canvas deck matrix channels
            for (let obj of mapObjects) {
                ctx.fillStyle = obj.color;
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                ctx.strokeStyle = '#2d1515';
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
            }

            // 4. 🔦 HORROR AMBIENT LIGHTING MASK FLASHLIGHT LENS SHROUD ENGINE
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.97)'; // Creates heavy midnight blinders layout view
            ctx.beginPath();
            ctx.rect(0, 0, canvas.width, canvas.height);
            
            // Slice structural paths cutting a visual key wedge out pointing towards aiming crosshairs markers
            ctx.moveTo(player.x, player.y);
            const raySpreadArc = 0.40; // Focal spread width size configurations for ray beams
            ctx.arc(player.x, player.y, 220, player.angle - raySpreadArc, player.angle + raySpreadArc);
            ctx.lineTo(player.x, player.y);
            
            ctx.closePath();
            ctx.fill('evenodd'); // Erases masking block internally where flashlight field paths overlap geometries
            ctx.restore();
