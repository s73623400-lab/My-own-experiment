<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe - Sprite Arena</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111116;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background-color: #000000;
            border: 4px solid #b91c1c; 
            box-shadow: 0 0 30px rgba(185, 28, 28, 0.4);
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        // 👤 PLAYER SPRITE CONFIGURATION PARAMETERS
        let player = {
            x: 400,
            y: 300,       // Spawn slightly lower down so they don't get stuck inside the counter
            width: 32,   
            height: 36,
            speed: 4,
            isMoving: false,
            animTimer: 0,
            walkFrame: 0 
        };

        // 🪑 COLLISION ENGINE OBJECT MATRICES (Counter, Machines, and Laptop zones)
        let mapObjects = [
            // The Barista Counter bounding rectangle box
            { x: 160, y: 140, w: 480, h: 60, color: '#451a03', borderColor: '#78350f', label: 'Barista Counter' },
            // Left Coffee Brewer Machine
            { x: 200, y: 90, w: 50, h: 50, color: '#334155', borderColor: '#475569', label: 'Espresso Unit A' },
            // Right Coffee Brewer Machine
            { x: 550, y: 90, w: 50, h: 50, color: '#334155', borderColor: '#475569', label: 'Espresso Unit B' },
            // Centered Laptop Notebook
            { x: 375, y: 125, w: 50, h: 25, color: '#0f172a', borderColor: '#38bdf8', label: 'Staff Laptop Terminal' }
        ];

        let keys = { w: false, a: false, s: false, d: false };

        window.onload = function() {
            window.addEventListener('keydown', (e) => {
                let key = e.key.toLowerCase();
                if (key in keys) keys[key] = true;
            });

            window.addEventListener('keyup', (e) => {
                let key = e.key.toLowerCase();
                if (key in keys) keys[key] = false;
            });

            requestAnimationFrame(engineFrameUpdateLoop);
        };

        function engineFrameUpdateLoop() {
            player.isMoving = false;
            let nextX = player.x;
            let nextY = player.y;

            // Process movement inputs matrix
            if (keys.w) { nextY -= player.speed; player.isMoving = true; }
            if (keys.s) { nextY += player.speed; player.isMoving = true; }
            if (keys.a) { nextX -= player.speed; player.isMoving = true; }
            if (keys.d) { nextX += player.speed; player.isMoving = true; }

            // Active path obstruction checking (prevents clipping through walls/furniture)
            if (!checkSolidObjectCollisions(nextX, player.y)) {
                player.x = nextX;
            }
            if (!checkSolidObjectCollisions(player.x, nextY)) {
                player.y = nextY;
            }

            // Hard boundary screens locks
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;

            // Step timeline loops mapping
            if (player.isMoving) {
                player.animTimer++;
                if (player.animTimer > 12) { 
                    player.walkFrame = player.walkFrame === 0 ? 1 : 0;
                    player.animTimer = 0;
                }
            } else {
                player.walkFrame = 0; 
            }

            // --- RENDERING PIPELINE ---
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background matrix grids
            ctx.strokeStyle = '#222226';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // 🎯 DRAW BACKSTAGE WORKPLACE ASSETS (Counter, Brewer nodes, Laptop screen)
            for (let obj of mapObjects) {
                // Main color fill panel
                ctx.fillStyle = obj.color;
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                
                // Border highlight strokes lines
                ctx.strokeStyle = obj.borderColor;
                ctx.lineWidth = 2;
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

                // Injects extra custom pixel designs depending on labels string definitions
                if (obj.label.includes('Espresso')) {
                    // Draw a glowing steam button and glass nozzle tip indicator onto brewers
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(obj.x + 8, obj.y + 10, 6, 6);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(px === undefined ? obj.x + 22 : obj.x + 22, obj.y + 35, 6, 12);
                }
                
                if (obj.label.includes('Laptop')) {
                    // Draw a glowing display window lid opening panel line matrix
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                    ctx.fillRect(obj.x + 4, obj.y + 4, obj.w - 8, obj.h - 14);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(obj.x + 12, obj.y + 18, obj.w - 24, 2);
                }
            }

            // 🎯 DRAW RETRO CHARACTER AVATAR
            let px = player.x;
            let py = player.y;

            // 1. Black Hair Outlines
            ctx.fillStyle = '#000000';
            ctx.fillRect(px + 4, py + 12, 4, 10);
            ctx.fillRect(px + 24, py + 12, 4, 10);

            // 2. Skin Face Base Layer
            ctx.fillStyle = '#fbcfe8'; 
            ctx.fillRect(px + 6, py + 10, 20, 16);

            // 3. Eyes Detailing
            ctx.fillStyle = '#000000';
            ctx.fillRect(px + 10, py + 14, 2, 4);
            ctx.fillRect(px + 20, py + 14, 2, 4);

            // 4. Mustache
            ctx.fillStyle = '#451a03';
            ctx.fillRect(px + 10, py + 20, 12, 2);

            // 5. Red Cap Brim Hat
            ctx.fillStyle = '#dc2626'; 
            ctx.fillRect(px + 4, py + 2, 24, 8);  
            ctx.fillRect(px + 2, py + 6, 28, 4);  

            // 6. Red Shirt Torso
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(px + 4, py + 26, 24, 6);

            // 7. Blue Denim Overalls
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(px + 8, py + 26, 4, 6);  
            ctx.fillRect(px + 20, py + 26, 4, 6); 
            ctx.fillRect(px + 8, py + 30, 16, 4); 

            // 8. Dynamic Walking Boot Steps
            ctx.fillStyle = '#991b1b'; 
            if (player.walkFrame === 0) {
                ctx.fillRect(px + 6, py + 34, 6, 4);
                ctx.fillRect(px + 20, py + 34, 6, 4);
            } else {
                ctx.fillRect(px + 6, py + 32, 6, 4);
                ctx.fillRect(px + 20, py + 34, 6, 4);
            }

            requestAnimationFrame(engineFrameUpdateLoop);
        }

        // Mathematical rectangle-intersection collision helper function
        function checkSolidObjectCollisions(x, y) {
            for (let obj of mapObjects) {
                if (x + player.width > obj.x && x < obj.x + obj.w &&
                    y + player.height > obj.y && y < obj.y + obj.h) {
                    return true; // Stop movement tracking path vector
                }
            }
            return false;
        }
    </script>
</body>
</html>
