<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Main Menu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
            background-image: linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.6)), url('your-background-image.jpg');
            background-size: cover;
            background-position: center;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 400px;
            width: 100%;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            margin-bottom: 1rem;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        /* Class used to hide screens dynamically */
        .hidden {
            display: none !important;
        }

        .menu-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn:hover:not(:disabled) {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateX(10px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .menu-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #1e293b;
        }

        .slot-status {
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.8;
        }

        .back-btn {
            border-color: #f43f5e;
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.05);
        }

        .back-btn:hover {
            background: #f43f5e !important;
            color: #ffffff !important;
            border-color: #f43f5e !important;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1 class="game-title">My Game</h1>
        
        <!-- Main Home Screen Menu -->
        <div id="mainScreen" class="menu-screen">
            <button id="mainNewGameBtn" class="menu-btn">New Game</button>
            <button id="mainContinueBtn" class="menu-btn">Continue</button>
        </div>

        <!-- Slot Selection Screen (Shared by both actions) -->
        <div id="slotScreen" class="menu-screen hidden">
            <h2 id="slotScreenTitle" style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #94a3b8;">Select a Profile</h2>
            
            <button class="menu-btn slot-btn" data-slot="1">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="2">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="3">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="4">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="5">New Game <span class="slot-status"></span></button>
            
            <button id="backBtn" class="menu-btn back-btn">← Back</button>
        </div>
    </div>

    <script>
        const SAVE_PREFIX = 'my_game_slot_';
        let currentMode = ''; // Track whether user clicked 'new' or 'continue'

        document.addEventListener('DOMContentLoaded', () => {
            const mainScreen = document.getElementById('mainScreen');
            const slotScreen = document.getElementById('slotScreen');
            const slotScreenTitle = document.getElementById('slotScreenTitle');
            
            const mainNewGameBtn = document.getElementById('mainNewGameBtn');
            const mainContinueBtn = document.getElementById('mainContinueBtn');
            const backBtn = document.getElementById('backBtn');
            const slotButtons = document.querySelectorAll('.slot-btn');

            // 1. Initial configuration check for Main Screen
            function refreshMainMenu() {
                let hasAnySave = false;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem(SAVE_PREFIX + i)) {
                        hasAnySave = true;
                        break;
                    }
                }
                // Disable continue altogether if absolutely no files exist across all 5 profiles
                mainContinueBtn.disabled = !hasAnySave;
            }

            // 2. Set labels and states on individual slot selection buttons
            function setupSlotButtons(mode) {
                currentMode = mode;
                slotScreenTitle.textContent = mode === 'new' ? 'Choose a slot to create:' : 'Choose a profile to load:';

                slotButtons.forEach(btn => {
                    const slotId = btn.getAttribute('data-slot');
                    const savedData = localStorage.getItem(SAVE_PREFIX + slotId);

                    if (savedData) {
                        const data = JSON.parse(savedData);
                        btn.innerHTML = `Profile ${slotId} <span class="slot-status">Level ${data.level} (Active)</span>`;
                        btn.disabled = false; // Always selectable to overwrite in 'new' mode or load in 'continue' mode
                    } else {
                        btn.innerHTML = `New Game <span class="slot-status">Empty Slot</span>`;
                        // Disable this specific button only if we are attempting to load/continue progress
                        btn.disabled = (mode === 'continue');
                    }
                });
            }

            // Navigation toggles
            mainNewGameBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('new');
            });

            mainContinueBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('continue');
            });

            backBtn.addEventListener('click', () => {
                slotScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                refreshMainMenu();
            });

            // Handle individual profile slot clicks
            slotButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const slotId = btn.getAttribute('data-slot');
                    const slotKey = SAVE_PREFIX + slotId;
                    const existingSave = localStorage.getItem(slotKey);

                    if (currentMode === 'new') {
                        if (existingSave) {
                            const overwrite = confirm(`Profile ${slotId} already has data. Overwrite and start a brand new game?`);
                            if (!overwrite) return;
                        }

                        // Create brand new file configuration
                        const newGameData = {
                            level: 1,
                            score: 0,
                            timestamp: new Date().toLocaleDateString()
                        };
                        localStorage.setItem(slotKey, JSON.stringify(newGameData));
                        alert(`Creating Game Profile ${slotId}! Starting at Level 1...`);
                        // window.location.href = 'game.html?slot=' + slotId;

                    } else if (currentMode === 'continue') {
                        if (existingSave) {
                            const data = JSON.parse(existingSave);
                            alert(`Loading Profile ${slotId}! (Level: ${data.level})`);
                            // window.location.href = 'game.html?slot=' + slotId;
                        }
                    }
                    
                    // Return back to core dashboard after selection process completes
                    slotScreen.classList.add('hidden');
                    mainScreen.classList.remove('hidden');
                    refreshMainMenu();
                });
            });

            // Run application initializer checks on system boots
            refreshMainMenu();
        });
    </script>
</body>
</html>
