<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <style>
        /* This sets your neat, warm coffee background color */
        body {
            background-color: #D2B48C; 
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2c1d11; /* Dark coffee brown text */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers everything horizontally */
            justify-content: center;
        }

        /* Clean wrapper to keep everything perfectly neat and stacked */
        .menu-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.4); /* Subtle glass panel effect */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        /* Styling buttons to make them look clickable and professional */
        button {
            background-color: #5c3a21;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin: 10px 0;
        }

        button:hover {
            background-color: #422815;
            transform: scale(1.02);
        }

        .fade-text {
            cursor: pointer;
            font-weight: 500;
            margin-top: 15px;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <!-- 1. The Welcome and Initial Start Menu Screen -->
    <div id="start-menu" class="menu-container">
        <!-- Clicking this title hides it cleanly -->
        <h1 style="cursor: pointer;" onclick="this.style.display = 'none';">
            Welcome to the Coffee Shop
        </h1>

        <h2>Begin Shift!</h2>
        
        <!-- Clicking this switches the view to the Outside Scene layout -->
        <button onclick="document.getElementById('start-menu').style.display = 'none'; document.getElementById('outside-scene').style.display = 'block';">
            Walk Inside and start your shift 🚪
        </button>
    </div>

    <!-- 2. The Interactive Outside Scene (Hidden until the button above is pressed) -->
    <div id="outside-scene" class="menu-container" style="display: none;">
        <h2>🏡 Outside the Coffee Shop</h2>
        <p>The morning sun is shining on your small, cosy cafe. It is time to open up!</p>
        
        <!-- This button triggers your local interactive map.html game file -->
        <button onclick="window.location.href='map.html';">Click to begin game!</button> 
    </div>

    <!-- Clicking this text makes it fade away instantly -->
    <p class="fade-text" onclick="this.style.opacity = '0';">
        📍 Circle Road (Click to clear location)
    </p>

</body>
</html>
