<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
            position: relative;
        }

        /* Horror Smiley Face in the Top Right */
        .horror-smile {
            position: absolute;
            top: 5%;
            right: 5%;
            width: 250px;
            height: 250px;
            transform: rotate(15deg);
            opacity: 0.85;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(220, 38, 38, 0.4));
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #dc2626;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.6);
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Class used to hide screens dynamically via JS */
        .hidden {
            display: none !important;
        }

        .menu-btn {
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid #262626;
            color: #d4d4d8;
            padding: 1.1rem 2rem;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
        }

        .menu-btn:hover:not(:disabled) {
            background: #dc2626;
            color: #000000;
            border-color: #dc2626;
            transform: translateX(12px);
            box-shadow: -5px 0 15px rgba(220, 38, 38, 0.5);
        }

        .menu-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            border-color: #171717;
        }

        .slot-status {
            font-size: 0.85rem;
            font-weight: normal;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .back-btn {
            border-color: #404040;
            color: #a3a3a3;
            margin-top: 0.5rem;
        }

        .back-btn:hover {
            background: #404040 !important;
            color: #ffffff !important;
            border-color: #404040 !important;
        }
        
        .screen-title {
            font-size: 1.2rem; 
            margin-bottom: 0.5rem; 
            color: #737373;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

        <!-- Wide, stitched/creepy smile -->
        <path d="M 35 110 Q 100 175 165 110 Q 100 145 35 110 Z" fill="#dc2626" />
        <!-- Jagged teeth details inside the smile -->
        <path d="M 45 115 L 55 125 L 65 118 L 75 130 L 90 120 L 105 132 L 120 121 L 135 129 L 145 118 L 155 123" stroke="#000000" stroke-width="2" fill="none" />

        <!-- Game Title -->
        <h1 class="game-title">The Hollow<br>Cafe</h1>
        
        <!-- MAIN SCREEN -->
        <div id="mainScreen" class="menu-screen">
            <button id="mainNewGameBtn" class="menu-btn">New Game</button>
            <button id="mainContinueBtn" class="menu-btn">Continue</button>
        </div>

        <div id="slotScreen" class="menu-screen hidden">
            <h2 id="slotScreenTitle" class="screen-title">Select a Slot</h2>
            
            <!-- The 5 Game Slots -->
            <button class="menu-btn slot-btn" data-slot="1">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="2">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="3">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="4">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="5">New Game <span class="slot-status"></span></button>
            
            <button id="backBtn" class="menu-btn back-btn">← Back</button>
        </div>
    </div>

    <script>
        const SAVE_PREFIX = 'hollow_cafe_slot_';
        let currentMode = ''; // Will be 'new' or 'continue'

        document.addEventListener('DOMContentLoaded', () => {
            const mainScreen = document.getElementById('mainScreen');
            const slotScreen = document.getElementById('slotScreen');
            const slotScreenTitle = document.getElementById('slotScreenTitle');
            
            const mainNewGameBtn = document.getElementById('mainNewGameBtn');
            const mainContinueBtn = document.getElementById('mainContinueBtn');
            const backBtn = document.getElementById('backBtn');
            const slotButtons = document.querySelectorAll('.slot-btn');

            // Evaluates all slots to decide if the main "Continue" button should be active
            function refreshMainMenu() {
                let hasAnySave = false;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem(SAVE_PREFIX + i)) {
                        hasAnySave = true;
                        break;
                    }
                }
                mainContinueBtn.disabled = !hasAnySave;
            }

            // Updates text labels and availability for the 5 interactive slots
            function setupSlotButtons(mode) {
                currentMode = mode;
                slotScreenTitle.textContent = mode === 'new' ? 'Select a slot to start:' : 'Select progress to load:';

                slotButtons.forEach(btn => {
                    const slotId = btn.getAttribute('data-slot');
                    const savedData = localStorage.getItem(SAVE_PREFIX + slotId);

                    if (savedData) {
                        const data = JSON.parse(savedData);
                        btn.innerHTML = `Profile ${slotId} <span class="slot-status">Day ${data.day} (Saved)</span>`;
                        btn.disabled = false; // Accessible to overwrite (New Game) or boot up (Continue)
                    } else {
                        // If empty, always displays "New Game" text as requested
                        btn.innerHTML = `New Game <span class="slot-status">[Empty Slot]</span>`;
                        // Block clicking this slot if trying to Continue a game that doesn't exist
                        btn.disabled = (mode === 'continue');
                    }
                });
            }

            // Click Handlers for Main Buttons (Transitions screens instantly)
            mainNewGameBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('new');
            });

            mainContinueBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('continue');
            });

            backBtn.addEventListener('click', () => {
                slotScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                refreshMainMenu();
            });

            // Click Handlers for the 5 interactive Game Slots
            slotButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const slotId = btn.getAttribute('data-slot');
                    const slotKey = SAVE_PREFIX + slotId;
                    const existingSave = localStorage.getItem(slotKey);

                    if (currentMode === 'new') {
                        if (existingSave) {
                            const overwrite = confirm(`Warning: Profile slot ${slotId} has existing data. Wiping progress to start fresh?`);
                            if (!overwrite) return;
                        }

                        // Generate a blank profile save template
                        const newGameData = {
                            day: 1,
                            inventory: [],
                            timestamp: new Date().toLocaleDateString()
                        };
                        localStorage.setItem(slotKey, JSON.stringify(newGameData));
                        alert(`Creating Profile ${slotId}... Welcome to The Hollow Cafe.`);
                        // window.location.href = 'game.html?slot=' + slotId;
