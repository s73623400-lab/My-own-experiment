<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: #000000;
            color: #b91c1c;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
            position: relative;
        }

        /* UNCANNY SCARY HAUNTED SMILEY FACE CONTAINER */
        .horror-face-container {
            position: absolute;
            top: 15%;
            right: 8%;
            width: 340px;
            height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 1;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.1));
            animation: slowTwitch 5s ease-in-out infinite alternate;
        }

        /* Unsettling organic twitching motion */
        @keyframes slowTwitch {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(2deg) scale(0.97); }
            100% { transform: rotate(-2deg) scale(1.03); }
        }

        /* Staring Wide Eyes Row */
        .eyes-row {
            display: flex;
            justify-content: space-between;
            width: 80%;
        }

        .uncanny-eye {
            width: 80px;
            height: 55px;
            background: #ffffff;
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 15px #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Small unblinking pitch-black pupils */
        .uncanny-eye::after {
            content: '';
            width: 14px;
            height: 14px;
            background: #000000;
            border-radius: 50%;
            animation: lookAround 6s ease-in-out infinite alternate;
        }

        @keyframes lookAround {
            0% { transform: translate(-4px, 2px); }
            50% { transform: translate(4px, -2px); }
            100% { transform: translate(0px, 0px); }
        }

        /* CURVED SCARY SMILE GRIN WITH INDIVIDUAL SHARP TEETH */
        .uncanny-mouth {
            width: 290px;
            height: 120px;
            background: #000000;
            border: 4px solid #ffffff;
            /* Curved crescent profile */
            border-radius: 10px 10px 130px 130px; 
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(11, 1fr); 
            gap: 2px; 
            padding: 3px;
            box-shadow: 0 5px 30px rgba(255, 255, 255, 0.15);
        }

        /* Individual rectangular blocks shaped into realistic sharp teeth */
        .tooth {
            background: #ffffff;
            height: 100%;
            width: 100%;
            /* Taper into pointed fangs */
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%); 
            box-shadow: inset 0 -10px 10px rgba(0,0,0,0.3);
            transform-origin: top center;
        }

        /* Lower teeth rows pointing upward */
        .tooth.bottom-row {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform-origin: bottom center;
        }

        /* Shrink side corner fangs to align smoothly along the curve profile */
        .tooth:nth-child(1), .tooth:nth-child(11) { height: 45%; }
        .tooth:nth-child(2), .tooth:nth-child(10) { height: 65%; }
        .tooth:nth-child(3), .tooth:nth-child(9)  { height: 85%; }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #b91c1c;
            text-shadow: 0 0 15px rgba(185, 28, 28, 0.5);
            margin-bottom: 1rem;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .hidden {
            display: none !important;
        }

        .menu-btn {
            background: rgba(10, 0, 0, 0.9);
            border: 2px solid #450a0a;
            color: #b91c1c;
            padding: 1.2rem 2rem;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
        }

        .menu-btn:hover:not(:disabled) {
            background: #b91c1c;
            color: #000000;
            border-color: #b91c1c;
            transform: translateX(8px);
            box-shadow: 0 0 25px rgba(185, 28, 28, 0.6);
        }

        .menu-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            border-color: #1a0505;
        }

        .slot-status {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .back-btn {
            border-color: #444;
            color: #666;
            margin-top: 1rem;
        }

        .back-btn:hover {
            background: #333 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
    </style>
</head>
<body>

    <!-- Redesigned High-Contrast Haunted Creepypasta Face -->
    <div class="horror-face-container">
        <div class="eyes-row">
            <div class="uncanny-eye"></div>
            <div class="uncanny-eye"></div>
        </div>
        <div class="uncanny-mouth">
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
        </div>
    </div>

    <div class="menu-container">
        <h1 class="game-title">The Hollow Cafe</h1>
        
        <!-- Main Screen -->
        <div id="mainScreen" class="menu-screen">
            <button id="mainNewGameBtn" class="menu-btn">New Game</button>
            <button id="mainContinueBtn" class="menu-btn">Continue</button>
        </div>

        <!-- 5 Slots Screen -->
        <div id="slotScreen" class="menu-screen hidden">
            <h2 id="slotScreenTitle" style="font-size: 1.2rem; margin-bottom: 0.5rem; color: #7f1d1d;">SELECT TARGET FILES</h2>
            
            <button class="menu-btn slot-btn" data-slot="1">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="2">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="3">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="4">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="5">New Game <span class="slot-status"></span></button>
            
            <button id="backBtn" class="menu-btn back-btn">← RETURN</button>
        </div>
    </div>

    <script>
        const SAVE_PREFIX = 'hollow_cafe_slot_';
        let currentMode = ''; 

        document.addEventListener('DOMContentLoaded', () => {
            const mainScreen = document.getElementById('mainScreen');
            const slotScreen = document.getElementById('slotScreen');
            const slotScreenTitle = document.getElementById('slotScreenTitle');
            
            const mainNewGameBtn = document.getElementById('mainNewGameBtn');
            const mainContinueBtn = document.getElementById('mainContinueBtn');
            const backBtn = document.getElementById('backBtn');
            const slotButtons = document.querySelectorAll('.slot-btn');

            function refreshMainMenu() {
                let hasAnySave = false;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem(SAVE_PREFIX + i)) {
                        hasAnySave = true;
                        break;
                    }
                }
                mainContinueBtn.disabled = !hasAnySave;
            }

            function setupSlotButtons(mode) {
                currentMode = mode;
                slotScreenTitle.textContent = mode === 'new' ? 'CHOOSE A SLOT TO OVERWRITE:' : 'LOAD ACTIVE ENTRY:';

                slotButtons.forEach(btn => {
                    const slotId = btn.getAttribute('data-slot');
                    const savedData = localStorage.getItem(SAVE_PREFIX + slotId);

                    if (savedData) {
                        const data = JSON.parse(savedData);
                        btn.innerHTML = `Profile ${slotId} <span class="slot-status">Day ${data.day} (Active)</span>`;
                        btn.disabled = false; 
                    } else {
                        btn.innerHTML = `New Game <span class="slot-status">[Empty]</span>`;
                        btn.disabled = (mode === 'continue'); 
                    }
                });
            }

            mainNewGameBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
