<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Main Menu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
            /* Optional: Add a background image for your game here */
            background-image: linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.6)), url('your-background-image.jpg');
            background-size: cover;
            background-position: center;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 400px;
            width: 100%;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            margin-bottom: 1rem;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .menu-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .menu-btn:hover:not(:disabled) {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateX(10px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Styling for when Continue is disabled (no save file found) */
        .menu-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #1e293b;
        }

        .tooltip {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: -0.5rem;
            padding-left: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1 class="game-title">My Game</h1>
        
        <div class="menu-options">
            <!-- New Game Button -->
            <button id="newGameBtn" class="menu-btn">New Game</button>
            
            <!-- Continue Button -->
            <button id="continueBtn" class="menu-btn">Continue</button>
            <div id="continueHint" class="tooltip"></div>
        </div>
    </div>

    <script>
        // Key used to look up save data in the browser's storage
        const SAVE_KEY = 'my_game_save_data';

        document.addEventListener('DOMContentLoaded', () => {
            const newGameBtn = document.getElementById('newGameBtn');
            const continueBtn = document.getElementById('continueBtn');
            const continueHint = document.getElementById('continueHint');

            // Check if save file exists
            const savedProgress = localStorage.getItem(SAVE_KEY);

            if (savedProgress) {
                // Save file exists: Enable Continue
                continueBtn.disabled = false;
                continueHint.textContent = "Resume your last adventure.";
            } else {
                // No save file: Disable Continue
                continueBtn.disabled = true;
                continueHint.textContent = "No save data found.";
            }

            // Handle New Game click
            newGameBtn.addEventListener('click', () => {
                if (savedProgress) {
                    const confirmOverwrite = confirm("Starting a new game will overwrite your existing save file. Do you want to proceed?");
                    if (!confirmOverwrite) return;
                }
                
                // Initialize default game state data
                const initialSaveData = {
                    level: 1,
                    score: 0,
                    dateCreated: new Date().toISOString()
                };
                
                // Store initial data and redirect
                localStorage.setItem(SAVE_KEY, JSON.stringify(initialSaveData));
                alert("Starting a brand new game!");
                // window.location.href = 'game.html'; // Uncomment to link to your gameplay page
            });

            // Handle Continue click
            continueBtn.addEventListener('click', () => {
                const data = JSON.parse(localStorage.getItem(SAVE_KEY));
                alert(`Loading your progress! Level: ${data.level}, Score: ${data.score}`);
                // window.location.href = 'game.html'; // Uncomment to link to your gameplay page
            });
        });
    </script>
</body>
</html>
