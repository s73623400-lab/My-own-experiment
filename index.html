<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Main Menu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000000; /* Switched screen background to pure horror black */
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
            position: relative;
        }

        /* Procedural Horror Smiley Face in Top Right */
        .horror-face {
            position: absolute;
            top: 5%;
            right: 5%;
            width: 250px;
            height: 250px;
            transform: rotate(15deg); /* Angled as requested */
            opacity: 0.85;
            pointer-events: none; /* Keeps it purely visual so it doesn't block clicks */
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.4)); /* Eerie crimson glow */
        }

        /* SVG internal artwork mapping closely to raw horror sketches */
        .horror-face svg {
            width: 100%;
            height: 100%;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 400px;
            width: 100%;
            z-index: 10; /* Ensures buttons stay on top of any design effects */
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ef4444; /* Changed title colors to blood crimson */
            text-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
            margin-bottom: 1rem;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .menu-btn {
            background: rgba(15, 23, 42, 0.8); /* Dark slate semi-transparent base */
            border: 2px solid #1e293b;
            color: #e2e8f0;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn:hover:not(:disabled) {
            background: #ef4444;
            color: #000000;
            border-color: #ef4444;
            transform: translateX(10px);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
        }

        .menu-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            border-color: #0f172a;
        }

        .slot-status {
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .back-btn {
            border-color: #475569;
            color: #94a3b8;
            background: transparent;
        }

        .back-btn:hover {
            background: #ffffff !important;
            color: #000000 !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Angled Horror Smiley Face Graphics Layer -->
    <div class="horror-face">
        <svg viewBox="0 0 100 100" xmlns="http://w3.org">
            <!-- Left Creepy Jagged Eye -->
            <path d="M25,30 Q35,20 40,35 Q30,40 25,30 Z" fill="#ffffff"/>
            <circle cx="34" cy="32" r="2" fill="#ef4444" />
            
            <!-- Right Creepy Jagged Eye -->
            <path d="M75,30 Q65,20 60,35 Q70,40 75,30 Z" fill="#ffffff"/>
            <circle cx="66" cy="32" r="2" fill="#ef4444" />
            
            <!-- Wide Sinister Stitched/Sharp Grin -->
            <path d="M15,55 Q50,85 85,55 Q50,70 15,55 Z" fill="#ffffff"/>
            <!-- Sharp Teeth Details inside grin -->
            <path d="M25,58 L28,64 L32,59 L36,66 L41,60 L46,68 L51,60 L56,68 L61,60 L66,66 L70,59 L73,63 L77,57" stroke="#000000" stroke-width="1" fill="none"/>
        </svg>
    </div>

    <div class="menu-container">
        <h1 class="game-title">The Descent</h1>
        
        <!-- Main Home Screen Menu -->
        <div id="mainScreen" class="menu-screen">
            <button id="mainNewGameBtn" class="menu-btn">New Game</button>
            <button id="mainContinueBtn" class="menu-btn">Continue</button>
        </div>

        <!-- Slot Selection Screen -->
        <div id="slotScreen" class="menu-screen hidden">
            <h2 id="slotScreenTitle" style="font-size: 1.3rem; margin-bottom: 0.5rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px;">Select a File</h2>
            
            <button class="menu-btn slot-btn" data-slot="1">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="2">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="3">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="4">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="5">New Game <span class="slot-status"></span></button>
            
            <button id="backBtn" class="menu-btn back-btn">← Back</button>
        </div>
    </div>

    <script>
        const SAVE_PREFIX = 'my_horror_game_slot_';
        let currentMode = '';

        document.addEventListener('DOMContentLoaded', () => {
            const mainScreen = document.getElementById('mainScreen');
            const slotScreen = document.getElementById('slotScreen');
            const slotScreenTitle = document.getElementById('slotScreenTitle');
            
            const mainNewGameBtn = document.getElementById('mainNewGameBtn');
            const mainContinueBtn = document.getElementById('mainContinueBtn');
            const backBtn = document.getElementById('backBtn');
            const slotButtons = document.querySelectorAll('.slot-btn');

            function refreshMainMenu() {
                let hasAnySave = false;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem(SAVE_PREFIX + i)) {
                        hasAnySave = true;
                        break;
                    }
                }
                mainContinueBtn.disabled = !hasAnySave;
            }

            function setupSlotButtons(mode) {
                currentMode = mode;
                slotScreenTitle.textContent = mode === 'new' ? 'Corrupt a new slot:' : 'Resume data string:';

                slotButtons.forEach(btn => {
                    const slotId = btn.getAttribute('data-slot');
                    const savedData = localStorage.getItem(SAVE_PREFIX + slotId);

                    if (savedData) {
                        const data = JSON.parse(savedData);
                        btn.innerHTML = `File ${slotId} <span class="slot-status">Depth ${data.level} (Saved)</span>`;
                        btn.disabled = false;
                    } else {
                        btn.innerHTML = `New Game <span class="slot-status">[Empty]</span>`;
                        btn.disabled = (mode === 'continue');
                    }
                });
            }

            mainNewGameBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('new');
            });

            mainContinueBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('continue');
            });

            backBtn.addEventListener('click', () => {
                slotScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                refreshMainMenu();
            });

            slotButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const slotId = btn.getAttribute('data-slot');
                    const slotKey = SAVE_PREFIX + slotId;
                    const existingSave = localStorage.getItem(slotKey);

                    if (currentMode === 'new') {
                        if (existingSave) {
                            const overwrite = confirm(`Warning: Overwriting File ${slotId} will permanently purge its data history. Continue?`);
                            if (!overwrite) return;
                        }

                        const newGameData = {
                            level: 1,
                            score: 0,
                            timestamp: new Date().toLocaleDateString()
                        };
                        localStorage.setItem(slotKey, JSON.stringify(newGameData));
                        alert(`File ${slotId} initialized.`);

                    } else if (currentMode === 'continue') {
                        if (existingSave) {
                            const data = JSON.parse(existingSave);
                            alert(`Loading File ${slotId}... returning to Depth ${data.level}`);
                        }
                    }
                    
                    slotScreen.classList.add('hidden');
                    mainScreen.classList.remove('hidden');
                    refreshMainMenu();
                });
            });
