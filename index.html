<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, 'Segoe UI', sans-serif;
        }

        body {
            background: #000000;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
            position: relative;
        }

        /* Horror Smiley Face Asset Container */
        .horror-face {
            position: absolute;
            top: 5%;
            right: 5%;
            width: 250px;
            height: 250px;
            transform: rotate(15deg);
            opacity: 0.85;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.4));
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 400px;
            width: 100%;
            z-index: 2; /* Keeps text layered above any overlapping visual assets */
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ef4444;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .menu-btn {
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid #334155;
            color: #94a3b8;
            padding: 1.2rem 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
        }

        .menu-btn:hover:not(:disabled) {
            background: #000000;
            color: #ef4444;
            border-color: #ef4444;
            transform: translateX(10px);
            box-shadow: -5px 0 15px rgba(239, 68, 68, 0.3);
        }

        .menu-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            border-color: #1e293b;
            color: #475569;
        }

        .slot-status {
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.8;
        }

        .back-btn {
            border-color: #475569;
            color: #475569;
        }

        .back-btn:hover {
            background: #1e293b !important;
            color: #ffffff !important;
            border-color: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- Inline Vector SVG Graphic: Horrifying Blood-Red Creepy Smile Face -->
    <svg class="horror-face" viewBox="0 0 200 200" xmlns="http://w3.org">
        <!-- Jagged, Hollow Left Eye -->
        <path d="M 40,60 Q 55,40 70,65 Q 55,85 40,60 Z" fill="#ef4444" />
        <path d="M 45,62 Q 55,50 65,65" stroke="#000" stroke-width="2" fill="none" />
        
        <!-- Jagged, Hollow Right Eye -->
        <path d="M 130,65 Q 145,40 160,60 Q 145,85 130,65 Z" fill="#ef4444" />
        <path d="M 135,65 Q 145,50 155,62" stroke="#000" stroke-width="2" fill="none" />
        
        <!-- Wide, Stitched Unsettling Smile -->
        <path d="M 30,110 Q 100,180 170,110 Q 100,140 30,110 Z" fill="#ef4444" />
        
        <!-- Jagged Teeth/Stitch lines detailing across mouth -->
        <path d="M 50,118 L 55,135 M 75,123 L 78,144 M 100,125 L 100,146 M 125,123 L 122,144 M 150,118 L 145,135" stroke="#000000" stroke-width="2.5" />
    </svg>

    <div class="menu-container">
        <h1 class="game-title">The Hollow<br>Cafe</h1>
        
        <!-- Main Dashboard View -->
        <div id="mainScreen" class="menu-screen">
            <button id="mainNewGameBtn" class="menu-btn">New Game</button>
            <button id="mainContinueBtn" class="menu-btn">Continue</button>
        </div>

        <!-- Dynamic Profile Slots View -->
        <div id="slotScreen" class="menu-screen hidden">
            <h2 id="slotScreenTitle" style="font-size: 1.2rem; margin-bottom: 0.5rem; color: #64748b; text-transform: uppercase;">Select a File</h2>
            
            <button class="menu-btn slot-btn" data-slot="1">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="2">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="3">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="4">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="5">New Game <span class="slot-status"></span></button>
            
            <button id="backBtn" class="menu-btn back-btn">← Back</button>
        </div>
    </div>

    <script>
        const SAVE_PREFIX = 'hollow_cafe_slot_';
        let currentMode = ''; 

        document.addEventListener('DOMContentLoaded', () => {
            const mainScreen = document.getElementById('mainScreen');
            const slotScreen = document.getElementById('slotScreen');
            const slotScreenTitle = document.getElementById('slotScreenTitle');
            
            const mainNewGameBtn = document.getElementById('mainNewGameBtn');
            const mainContinueBtn = document.getElementById('mainContinueBtn');
            const backBtn = document.getElementById('backBtn');
            const slotButtons = document.querySelectorAll('.slot-btn');

            // Scans local browser storage arrays to toggle main continue availability checks
            function refreshMainMenu() {
                let hasAnySave = false;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem(SAVE_PREFIX + i)) {
                        hasAnySave = true;
                        break;
                    }
                }
                mainContinueBtn.disabled = !hasAnySave;
            }

            // Updates the slot descriptions based on whether they contain data or are empty
            function setupSlotButtons(mode) {
                currentMode = mode;
                slotScreenTitle.textContent = mode === 'new' ? 'Choose a slot to overwrite:' : 'Choose a file to load:';

                slotButtons.forEach(btn => {
                    const slotId = btn.getAttribute('data-slot');
                    const savedData = localStorage.getItem(SAVE_PREFIX + slotId);

                    if (savedData) {
                        const data = JSON.parse(savedData);
                        btn.innerHTML = `File ${slotId} <span class="slot-status">Night ${data.night} (Active)</span>`;
                        btn.disabled = false; 
                    } else {
                        btn.innerHTML = `New Game <span class="slot-status">Empty Slot</span>`;
                        btn.disabled = (mode === 'continue'); // Can't load an empty slot
                    }
                });
            }

            // Main Menu interactions
            mainNewGameBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('new');
            });

            mainContinueBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('continue');
            });

            backBtn.addEventListener('click', () => {
                slotScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                refreshMainMenu();
            });

            // Handle individual file slot interactions
            slotButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const slotId = btn.getAttribute('data-slot');
                    const slotKey = SAVE_PREFIX + slotId;
                    const existingSave = localStorage.getItem(slotKey);

                    if (currentMode === 'new') {
                        if (existingSave) {
                            const overwrite = confirm(`File ${slotId} already contains progress. Wipe data and start over at The Cafe?`);
                            if (!overwrite) return;
                        }

                        // Generate default initial profile metrics
                        const newGameData = {
                            night: 1,
                            score: 0,
                            time: "12:00 AM"
                        };
                        localStorage.setItem(slotKey, JSON.stringify(newGameData));
                        alert(`Opening File Slot ${slotId}... Welcome to Night 1.`);
                        // window.location.href = 'game.html?slot=' + slotId;

                    } else if (currentMode === 'continue') {
                        if (existingSave) {
                            const data = JSON.parse(existingSave);
                            alert(`Resuming File ${slotId}... Loading Night ${data.night}.`);
                            // window.location.href = 'game.html?slot=' + slotId;
                        }
                    }
