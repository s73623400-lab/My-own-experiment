<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: #000000;
            color: #b91c1c;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
            position: relative;
        }

        /* 1. ANIMATED HORROR FACE CONTAINER */
        .horror-face-container {
            position: absolute;
            top: 12%;
            right: 8%;
            width: 380px;
            height: 380px;
            transform: rotate(12deg);
            opacity: 0.75;
            z-index: 1;
            /* Subtly animates the face like it's breathing */
            animation: floatingDistortion 4s ease-in-out infinite alternate;
        }

        @keyframes floatingDistortion {
            0% { transform: rotate(12deg) scale(1); opacity: 0.65; }
            100% { transform: rotate(14deg) scale(1.03); opacity: 0.85; filter: drop-shadow(0 0 15px #ef4444); }
        }

        /* Glowing Slit-Pupil Eyes */
        .horror-eye {
            position: absolute;
            width: 85px;
            height: 35px;
            background: #1a0202;
            border: 2px solid #b91c1c;
            border-radius: 90% 10% 90% 10%; /* Makes eyes look unnaturally sharp and tilted */
            box-shadow: 0 0 20px #7f1d1d;
        }

        .horror-eye::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 48%;
            width: 6px;
            height: 24px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffffff;
        }

        .eye-left {
            top: 40px;
            left: 20px;
            transform: scaleX(-1) rotate(25deg); /* Flips the left eye shape */
        }

        .eye-right {
            top: 25px;
            right: 20px;
            transform: rotate(20deg);
        }

        /* 2. CUSTOM HAUNTED JAGGED SMILE */
        .horror-mouth {
            position: absolute;
            bottom: 30px;
            left: 40px;
            width: 280px;
            height: 120px;
            background: #110000;
            border: 3px solid #b91c1c;
            border-radius: 10% 10% 85% 85%; /* Hollow wide grin dynamic shape */
            box-shadow: 0 10px 30px rgba(185, 28, 28, 0.5);
            overflow: hidden; /* Clips the inner elements to form teeth */
        }

        /* Top Row of Teeth */
        .horror-mouth::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 30px;
            /* Pure CSS repeating linear gradients to render sharp triangles */
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, #b91c1c 10px, #b91c1c 20px),
                        repeating-linear-gradient(-45deg, transparent, transparent 10px, #b91c1c 10px, #b91c1c 20px);
            background-blend-mode: multiply;
        }

        /* Bottom Row of Teeth */
        .horror-mouth::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 30px;
            background: repeating-linear-gradient(45deg, transparent, transparent 12px, #991b1b 12px, #991b1b 24px),
                        repeating-linear-gradient(-45deg, transparent, transparent 12px, #991b1b 12px, #991b1b 24px);
            background-blend-mode: multiply;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #b91c1c;
            text-shadow: 0 0 15px rgba(185, 28, 28, 0.5);
            margin-bottom: 1rem;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .hidden {
            display: none !important;
        }

        .menu-btn {
            background: rgba(10, 0, 0, 0.9);
            border: 2px solid #450a0a;
            color: #b91c1c;
            padding: 1.2rem 2rem;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
        }

        .menu-btn:hover:not(:disabled) {
            background: #b91c1c;
            color: #000000;
            border-color: #b91c1c;
            transform: translateX(8px);
            box-shadow: 0 0 25px rgba(185, 28, 28, 0.6);
        }

        .menu-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            border-color: #1a0505;
        }

        .slot-status {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .back-btn {
            border-color: #444;
            color: #666;
            margin-top: 1rem;
        }

        .back-btn:hover {
            background: #333 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
    </style>
</head>
<body>

    <!-- Redesigned Haunted Horror Face Setup -->
    <div class="horror-face-container">
        <div class="horror-eye eye-left"></div>
        <div class="horror-eye eye-right"></div>
        <div class="horror-mouth"></div>
    </div>

    <div class="menu-container">
        <h1 class="game-title">The Hollow Cafe</h1>
        
        <!-- Main Screen -->
        <div id="mainScreen" class="menu-screen">
            <button id="mainNewGameBtn" class="menu-btn">New Game</button>
            <button id="mainContinueBtn" class="menu-btn">Continue</button>
        </div>

        <!-- 5 Slots Screen -->
        <div id="slotScreen" class="menu-screen hidden">
            <h2 id="slotScreenTitle" style="font-size: 1.2rem; margin-bottom: 0.5rem; color: #7f1d1d;">SELECT TARGET FILES</h2>
            
            <button class="menu-btn slot-btn" data-slot="1">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="2">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="3">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="4">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="5">New Game <span class="slot-status"></span></button>
            
            <button id="backBtn" class="menu-btn back-btn">← RETURN</button>
        </div>
    </div>

    <script>
        const SAVE_PREFIX = 'hollow_cafe_slot_';
        let currentMode = ''; 

        document.addEventListener('DOMContentLoaded', () => {
            const mainScreen = document.getElementById('mainScreen');
            const slotScreen = document.getElementById('slotScreen');
            const slotScreenTitle = document.getElementById('slotScreenTitle');
            
            const mainNewGameBtn = document.getElementById('mainNewGameBtn');
            const mainContinueBtn = document.getElementById('mainContinueBtn');
            const backBtn = document.getElementById('backBtn');
            const slotButtons = document.querySelectorAll('.slot-btn');

            function refreshMainMenu() {
                let hasAnySave = false;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem(SAVE_PREFIX + i)) {
                        hasAnySave = true;
                        break;
                    }
                }
                mainContinueBtn.disabled = !hasAnySave;
            }

            function setupSlotButtons(mode) {
                currentMode = mode;
                slotScreenTitle.textContent = mode === 'new' ? 'CHOOSE A SLOT TO OVERWRITE:' : 'LOAD ACTIVE ENTRY:';

                slotButtons.forEach(btn => {
                    const slotId = btn.getAttribute('data-slot');
                    const savedData = localStorage.getItem(SAVE_PREFIX + slotId);

                    if (savedData) {
                        const data = JSON.parse(savedData);
                        btn.innerHTML = `Profile ${slotId} <span class="slot-status">Day ${data.day} (Active)</span>`;
                        btn.disabled = false; 
                    } else {
                        btn.innerHTML = `New Game <span class="slot-status">[Empty]</span>`;
                        btn.disabled = (mode === 'continue'); 
                    }
                });
            }

            mainNewGameBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('new');
            });

            mainContinueBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('continue');
            });

            backBtn.addEventListener('click', () => {
                slotScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                refreshMainMenu();
            });
