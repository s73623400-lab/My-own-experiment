<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Cafe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: #000000;
            color: #b91c1c;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            overflow: hidden;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 450px;
            width: 100%;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #b91c1c;
            text-shadow: 0 0 15px rgba(185, 28, 28, 0.5);
            margin-bottom: 1rem;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .hidden {
            display: none !important;
        }

        /* Fully styled interactive button rules */
        .menu-btn {
            background: rgba(10, 0, 0, 0.9);
            border: 2px solid #450a0a;
            color: #b91c1c;
            padding: 1.2rem 2rem;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: left;
            border-radius: 4px;
            cursor: pointer; /* Confirms element is interactive by altering the mouse pointer */
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
        }

        /* Hover animation response */
        .menu-btn:hover:not(:disabled) {
            background: #b91c1c;
            color: #000000;
            border-color: #b91c1c;
            transform: translateX(8px);
            box-shadow: 0 0 25px rgba(185, 28, 28, 0.6);
        }

        .menu-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            border-color: #1a0505;
        }

        .slot-status {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .back-btn {
            border-color: #444;
            color: #666;
            margin-top: 1rem;
        }

        .back-btn:hover {
            background: #333 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1 class="game-title">The Hollow Cafe</h1>
        
        <!-- Main Screen (Home Menu) -->
        <div id="mainScreen" class="menu-screen">
            <!-- These are authentic <button> elements wired to click listeners -->
            <button id="mainNewGameBtn" class="menu-btn">New Game</button>
            <button id="mainContinueBtn" class="menu-btn">Continue</button>
        </div>

        <!-- Sub-Screen containing the 5 individual save profiles -->
        <div id="slotScreen" class="menu-screen hidden">
            <h2 id="slotScreenTitle" style="font-size: 1.2rem; margin-bottom: 0.5rem; color: #7f1d1d;">SELECT TARGET FILES</h2>
            
            <button class="menu-btn slot-btn" data-slot="1">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="2">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="3">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="4">New Game <span class="slot-status"></span></button>
            <button class="menu-btn slot-btn" data-slot="5">New Game <span class="slot-status"></span></button>
            
            <button id="backBtn" class="menu-btn back-btn">← RETURN</button>
        </div>
    </div>

    <script>
        const SAVE_PREFIX = 'hollow_cafe_slot_';
        let currentMode = ''; 

        document.addEventListener('DOMContentLoaded', () => {
            const mainScreen = document.getElementById('mainScreen');
            const slotScreen = document.getElementById('slotScreen');
            const slotScreenTitle = document.getElementById('slotScreenTitle');
            
            const mainNewGameBtn = document.getElementById('mainNewGameBtn');
            const mainContinueBtn = document.getElementById('mainContinueBtn');
            const backBtn = document.getElementById('backBtn');
            const slotButtons = document.querySelectorAll('.slot-btn');

            // Evaluates local browser storage to determine if 'Continue' should remain locked
            function refreshMainMenu() {
                let hasAnySave = false;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem(SAVE_PREFIX + i)) {
                        hasAnySave = true;
                        break;
                    }
                }
                mainContinueBtn.disabled = !hasAnySave;
            }

            // Sets up conditional styling and statuses for individual slot targets
            function setupSlotButtons(mode) {
                currentMode = mode;
                slotScreenTitle.textContent = mode === 'new' ? 'CHOOSE A SLOT TO OVERWRITE:' : 'LOAD ACTIVE ENTRY:';

                slotButtons.forEach(btn => {
                    const slotId = btn.getAttribute('data-slot');
                    const savedData = localStorage.getItem(SAVE_PREFIX + slotId);

                    if (savedData) {
                        const data = JSON.parse(savedData);
                        btn.innerHTML = `Profile ${slotId} <span class="slot-status">Day ${data.day} (Active)</span>`;
                        btn.disabled = false; 
                    } else {
                        btn.innerHTML = `New Game <span class="slot-status">[Empty]</span>`;
                        btn.disabled = (mode === 'continue'); 
                    }
                });
            }

            // EXPLICIT CLICK LISTENER FOR THE NEW GAME BUTTON
            mainNewGameBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');      // Hides the home screen view
                slotScreen.classList.remove('hidden');  // Reveals the 5 game slots sub-screen view
                setupSlotButtons('new');                 // Sets up configurations for new profile assignment
            });

            // EXPLICIT CLICK LISTENER FOR THE CONTINUE BUTTON
            mainContinueBtn.addEventListener('click', () => {
                mainScreen.classList.add('hidden');
                slotScreen.classList.remove('hidden');
                setupSlotButtons('continue');
            });

            // EXPLICIT CLICK LISTENER FOR THE BACK BUTTON
            backBtn.addEventListener('click', () => {
                slotScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                refreshMainMenu();
            });

            // Allocation click configurations for managing slot save updates
            slotButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const slotId = btn.getAttribute('data-slot');
                    const slotKey = SAVE_PREFIX + slotId;
                    const existingSave = localStorage.getItem(slotKey);

                    if (currentMode === 'new') {
                        if (existingSave) {
                            const overwrite = confirm(`Warning: Data exists in Slot ${slotId}. Overwrite progress?`);
                            if (!overwrite) return;
                        }

                        // Save data profile generation object
                        const newGameData = {
                            day: 1,
                            time: new Date().toLocaleDateString()
                        };
                        localStorage.setItem(slotKey, JSON.stringify(newGameData));
                        alert(`Starting New Game in Slot ${slotId}... entering the Cafe.`);
                        
                    } else if (currentMode === 'continue' && existingSave) {
                        const data = JSON.parse(existingSave);
                        alert(`Resuming Slot ${slotId} on Day ${data.day}...`);
                    }
                    
                    slotScreen.classList.add('hidden');
                    mainScreen.classList.remove('hidden');
                    refreshMainMenu();
                });
            });

            refreshMainMenu();
        });
    </script>
</body>
</html>
