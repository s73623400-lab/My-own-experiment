<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop Simulator - Grid System</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px 0;
        }

        #top-ui {
            background-color: #333;
            padding: 10px 20px;
            display: inline-block;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Main Game Canvas Board Viewport */
        #game-board {
            width: 750px;
            height: 400px;
            margin: 0 auto;
            background-color: #262626;
            border: 4px solid #444;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        /* 1. Circle Road Asset Container (Curved road mockup on left) */
        #circle-road {
            position: absolute;
            left: -80px;
            top: 20px;
            width: 200px;
            height: 360px;
            border: 40px solid #555;
            border-radius: 50%;
            border-left: none;
            border-bottom: none;
            pointer-events: none;
        }

        /* 2. Cafe Interior Grid Framework (Right panel map space) */
        #cafe-grid {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 500px;
            height: 360px;
            background-color: #2d2d2d;
            border: 2px solid #3a3a3a;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            padding: 4px;
            box-sizing: border-box;
        }

        /* Grid Tile blocks */
        .tile {
            background-color: #333333;
            border-radius: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .tile:hover { background-color: #3d3d3d; }

        /* Furniture Layout nodes */
        .door-node { background-color: #007bff !important; color: white; font-weight: bold; font-size: 11px; }
        .coffee-node { background-color: #b71c1c !important; } /* Red Coffee Icon base */
        .table-node { background-color: #f57f17 !important; }  /* Yellow dining tables */

        /* Interactive character dots elements */
        .player-token {
            width: 20px;
            height: 20px;
            background-color: #00ffcc;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px #00ffcc;
            z-index: 10;
        }

        .patron-token {
            width: 16px;
            height: 16px;
            background-color: #9c27b0; /* Purple customer dot */
            border-radius: 50%;
            position: absolute;
        }

        #status-bar {
            background-color: #222;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 14px;
            margin-top: 15px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="top-ui">
        📆 Day: <span id="day-val">1</span> &nbsp;|&nbsp; 💰 Earnings: $<span id="cash-val">0</span>
    </div>

    <div id="game-board">
        <!-- Curved road layout track -->
        <div id="circle-road"></div>

        <!-- The interactive Top-down Interior grid framework -->
        <div id="cafe-grid">
            <!-- Row 1 Tiles -->
            <div class="tile door-node" onclick="interactTile('door')">Door: Open</div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile coffee-node" onclick="interactTile('coffee')">☕</div>

            <!-- Row 2 Tiles -->
            <div class="tile"><div class="player-token" id="player-dot"></div></div>
            <div class="tile"></div>
            <div class="tile"><div class="patron-token" style="background:#e91e63;"></div></div>
            <div class="tile"></div>
            <div class="tile table-node" onclick="interactTile('table')">🪑</div>

            <!-- Row 3 Tiles -->
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"><div class="patron-token" style="background:#9c27b0;"></div></div>
            <div class="tile"></div>
            <div class="tile table-node" onclick="interactTile('table')">🪑</div>

            <!-- Row 4 Tiles -->
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile table-node" onclick="interactTile('table')">🪑</div>
        </div>
    </div>

    <div id="status-bar">
        Active Patrons: 3 (Ethan ordering...)
    </div>

    <script>
        let dayCounter = 1;
        let revenue = 0;
        let machineCharged = false;

        function interactTile(type) {
            const status = document.getElementById('status-bar');
            
            if (type === 'door') {
                status.innerText = "🚪 Door configuration active. Welcoming new patrons inside!";
            } else if (type === 'coffee') {
                machineCharged = true;
                status.innerText = "☕ Coffee machine activated! Espresso shot extracted and ready.";
                // Teleport player dot visually to the machine grid tile coordinate slot
                movePlayerVisual(4); 
            } else if (type === 'table') {
                if (machineCharged) {
                    revenue += 12;
                    dayCounter += 1;
                    
                    document.getElementById('cash-val').innerText = revenue;
                    document.getElementById('day-val').innerText = dayCounter;
                    
                    status.innerText = "🎉 Order delivered to the dining table! Advanced to Day " + dayCounter;
                    machineCharged = false;
                    
                    // Return player token dot back to counter baseline slot
                    movePlayerVisual(5);
                } else {
                    status.innerText = "⚠️ That table needs coffee! Hit the Red Coffee Machine tile first to brew.";
                }
            }
        }

        function movePlayerVisual(tileIndex) {
            const player = document.getElementById('player-dot');
            const targetTile = document.getElementsByClassName('tile')[tileIndex];
            targetTile.appendChild(player); // Snaps the player dot component cleanly into that exact grid box item
        }
    </script>

</body>
</html>
