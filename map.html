<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Coffee Shop Game</title>
    <style>
        /* Base page resetting styles */
        body {
            margin: 0;
            padding: 20px;
            background-color: #232731; /* Swapped backdrop to match standard windows */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        #game-container {
            width: 100%;
            max-width: 820px;
            background-color: #1e222b;
            border: 3px solid #4b5563;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* 🗺️ THE FLOOR MAP - Completely rebuilt colors to ensure perfect element visibility */
        #game-floor-map {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #0f1115; /* Clean contrasting dark asphalt tone */
            border: 4px solid #ff9f0a;  /* Bright neon border outlines the game frame window instantly */
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* 🛒 SHOP BUTTON LAYOUT */
        #shop-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ff9f0a;
            color: #000000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }

        /* MACHINE STATION ROW (Positioned behind counter deck layer) */
        .appliance-shelf {
            position: absolute;
            top: 20px;
            right: 25px;
            left: 130px;
            display: flex;
            justify-content: space-around;
        }
        .appliance {
            background-color: #2e3440;
            border: 2px solid #81a1c1;
            color: #e5e9f0;
            padding: 8px 14px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* THE BARISTA WORK STATION COUNTER ISLAND */
        #barista-counter {
            position: absolute;
            top: 150px;
            left: 0;
            width: 100%;
            height: 35px;
            background-color: #3b4252; /* Contrast adjustment against the floor grid layout */
            border-top: 3px solid #ff9f0a;
            border-bottom: 3px solid #ff9f0a;
        }
        #register-box {
            position: absolute;
            left: 45px;
            top: -8px;
            width: 25px;
            height: 8px;
            background-color: #ff3b30; /* High visibility red cash register indicator box */
            border-radius: 2px;
        }

        /* OUTLET ENTRANCE ACCESS GATE */
        #shop-doorway {
            position: absolute;
            bottom: 0;
            right: 50px;
            width: 90px;
            height: 14px;
            background-color: #30d158;
            color: black;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
            line-height: 14px;
        }
        #shop-doorway.closed { background-color: #ff3b30; color: white; }

        /* CIRCULAR CHARACTER TOKENS (PLAYER, CUSTOMERS, COURIERS) */
        .token {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            box-sizing: border-box;
            z-index: 5;
        }

        #player-barista {
            background-color: #2563eb;
            border: 2px solid #ffffff;
            left: 600px;
            top: 90px;
        }

        .customer-dot { border: 2px solid transparent; }
        .customer-dot.first-in-line { border-color: #ffffff; animation: pulsingBorder 1.5s infinite; }

        @keyframes pulsingBorder {
            0% { border-color: #ffffff; }
            50% { border-color: #ff9f0a; }
            100% { border-color: #ffffff; }
        }

        /* CLIENT MENU POPUP DIALOGUE CARD */
        .dialogue-bubble {
            position: absolute;
            background: #ffffff;
            color: #000000;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            bottom: 42px;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* INTERACTION LAYOUT STRIP */
        #control-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }
        .game-btn {
            flex: 1;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .game-btn:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; box-shadow: none; }
        #door-toggle-btn { background-color: #30d158; color: black; }
        #door-toggle-btn.is-closed { background-color: #ff3b30; color: white; }

        /* HEADS UP HUD METRICS PLATFORM */
        #hud-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 2px solid #4b5563;
            padding-top: 15px;
            text-align: center;
        }
        .hud-box .title { color: #9ca3af; font-size: 13px; margin-bottom: 4px; }
        .hud-box .stat { font-size: 20px; font-weight: bold; color: #ffffff; }

        /* APP SYSTEM MODAL INTERFACES */
        .overlay-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 16px;
            display: none;
            z-index: 20;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        #phone-overlay {
            background-color: #000000;
            border: 4px solid #4b5563;
            width: 260px;
            height: 400px;
            padding: 15px;
        }
        .phone-display {
            background-color: #1c1c1e;
            height: 100%;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        #shop-overlay {
            background-color: #1e222b;
            border: 2px solid #ff9f0a;
            width: 380px;
            padding: 20px;
        }
        .shop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #282e3d;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game-floor-map" onclick="handleMapClick(event)">
            
            <button id="shop-btn" onclick="openShop(true); event.stopPropagation();">SHOP [🛒]</button>

            <div class="appliance-shelf">
                <div class="appliance">Espresso Station</div>
                <div class="appliance">Tea Infuser</div>
                <div class="appliance">Pastry Oven</div>
            </div>

            <div id="barista-counter">
                <div id="register-box"></div>
            </div>

            <!-- Native Element Overlay Node List Layer -->
            <div id="character-layer">
                <div id="player-barista" class="token">You</div>
            </div>

            <div id="shop-doorway">Door Open</div>
        </div>

        <div id="control-panel">
            <button id="door-toggle-btn" class="game-btn" onclick="toggleStoreDoor()">Shop Door: OPEN</button>
            <button id="serve-customer-btn" class="game-btn" onclick="processOrderTicket()" disabled>Walk behind Counter to Serve</button>
        </div>

        <div id="hud-dashboard">
            <div class="hud-box">
                <div class="title">Earnings</div>
                <div id="hud-cash" class="stat" style="color: #30d158;">$0.00</div>
            </div>
            <div class="hud-box">
                <div class="title">Items Served</div>
                <div id="hud-served" class="stat">0 items</div>
            </div>
            <div class="hud-box">
                <div class="title">Staff Helpers</div>
                <div id="hud-staff" class="stat">0</div>
            </div>
        </div>

        <!-- Phone Tracker Interface -->
        <div id="phone-overlay" class="overlay-card">
            <div class="phone-display">
                <div>
                    <div style="text-align:center; color:#30d158; font-weight:bold; border-bottom:1px solid #2c2c2e; padding-bottom:5px;">⚡ Courier App</div>
                    <div id="phone-text-body" style="font-size:12px; padding-top:15px; line-height:1.5; color:#ffffff;"></div>
                </div>
