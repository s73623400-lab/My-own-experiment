<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Coffee Shop Game</title>
    <style>
        /* Base page styling without visual box containers */
        body {
            margin: 0;
            padding: 10px;
            background: none !important; /* Stripped background */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        /* 👑 CONTAINER BACKGROUND REMOVED */
        #game-container {
            width: 98vw;
            max-width: 1400px;
            background: none !important; /* Stripped background */
            position: relative;
            box-sizing: border-box;
        }

        /* 🗺️ FLOOR MAP BACKGROUND REMOVED */
        #game-floor-map {
            position: relative;
            width: 100%;
            height: 520px;
            background: none !important; /* Stripped background */
            box-sizing: border-box;
        }

        /* 🛒 FIXED INTERACTION LAYER - Button elements are natively isolated and fully clickable */
        .ui-clickable-element {
            cursor: pointer !important;
            pointer-events: auto !important;
        }

        #shop-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ff9f0a;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
        }

        .appliance-shelf {
            position: absolute;
            top: 15px;
            right: 25px;
            left: 160px;
            display: flex;
            justify-content: space-around;
        }
        .appliance {
            background-color: #2e3440;
            border: 2px solid #81a1c1;
            color: #e5e9f0;
            padding: 10px 18px;
            font-size: 13px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* BARISTA COUNTER PLATFORM BACKGROUND REMOVED */
        #barista-counter {
            position: absolute;
            top: 200px;
            left: 0;
            width: 100%;
            height: 45px;
            border-top: 3px solid #ff9f0a;
            border-bottom: 3px solid #ff9f0a;
            background: none !important; /* Stripped background */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .counter-label-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #register-box {
            position: absolute;
            left: 45px;
            top: -8px;
            width: 25px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 2px;
        }

        #shop-doorway {
            position: absolute;
            bottom: 0;
            right: 80px;
            width: 110px;
            height: 18px;
            background-color: #30d158;
            color: black;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            line-height: 18px;
            border-radius: 4px 4px 0 0;
        }
        #shop-doorway.closed { background-color: #ff3b30; color: white; }

        /* CHARACTER GRID TOKENS LAYERING */
        .token {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        #player-barista {
            background-color: #2563eb;
            border: 2px solid #ffffff;
            left: 700px;
            top: 100px;
        }

        .customer-dot { border: 2px solid transparent; }
        .customer-dot.first-in-line { border-color: #ffffff; animation: pulsingBorder 1.5s infinite; }

        @keyframes pulsingBorder {
            0% { border-color: #ffffff; }
            50% { border-color: #ff9f0a; }
            100% { border-color: #ffffff; }
        }

        .dialogue-bubble {
            position: absolute;
            background: white;
            color: #000000;
            font-size: 11px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 6px;
            bottom: 48px;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* BOTTOM WORKSPACE CONTROLS STRIP */
        #control-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }
        .game-btn {
            flex: 1;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .game-btn:disabled { 
            background-color: #374151; 
            color: #6b7280; 
            box-shadow: none; 
        }
        #door-toggle-btn { background-color: #30d158; color: black; }
        #door-toggle-btn.is-closed { background-color: #ff3b30; color: white; }

        #hud-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 2px solid #4b5563;
            padding-top: 15px;
            text-align: center;
        }
        .hud-box .title { color: #9ca3af; font-size: 14px; margin-bottom: 4px; }
        .hud-box .stat { font-size: 22px; font-weight: bold; color: #ffffff; }

        /* FIXED SCREEN POPUP OVERLAY MODAL CARDS */
        .overlay-card {
            position: fixed; /* Switched to fixed layout windows to completely bypass floor click hijacking issues */
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            border-radius: 16px;
            display: none;
            z-index: 999999 !important; /* Locks modals safely on top of all canvas or element maps */
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        #tablet-overlay {
            background-color: #1e222b;
            border: 3px solid #2563eb;
            width: 440px;
            padding: 24px;
        }
        #tablet-overlay h3 { margin-top: 0; color: #2563eb; }
        .recipe-book-helper { margin: 15px 0; font-size: 13px; line-height: 1.6; color: #9ca3af; }

        #phone-overlay {
            background-color: #000000;
            border: 4px solid #4b5563;
            width: 270px;
            height: 420px;
            padding: 15px;
        }
        .phone-display {
            background-color: #1c1c1e;
            height: 100%;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        #shop-overlay {
            background-color: #1e222b;
            border: 2px solid #ff9f0a;
            width: 400px;
            padding: 20px;
        }
        .shop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #282e3d;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Re-styled Ground Map with no background image parameters to fix browser click drops -->
        <div id="game-floor-map" onclick="handleFloorClick(event)">
            
            <button id="shop-btn" class="ui-clickable-element" onclick="openShop(true); event.stopPropagation();">SHOP [🛒]</button>

            <div class="appliance-shelf">
                <div class="appliance ui-clickable-element" onclick="event.stopPropagation();">Espresso Station</div>
                <div class="appliance ui-clickable-element" onclick="event.stopPropagation();">Tea Infuser</div>
                <div class="appliance ui-clickable-element" onclick="event.stopPropagation();">Pastry Oven</div>
            </div>

            <div id="barista-counter">
                <div id="register-box"></div>
                <div class="counter-label-text">Counter Bar</div>
            </div>

            <div id="character-layer">
                <div id="player-barista" class="token">You</div>
            </div>

            <div id="shop-doorway" class="ui-clickable-element" onclick="toggleStoreDoor(); event.stopPropagation();">Door Open</div>
        </div>

        <div id="control-panel">
            <button id="door-toggle-btn" class="game-btn ui-clickable-element" onclick="toggleStoreDoor()">Shop Door: OPEN</button>
            <button id="serve-customer-btn" class="game-btn ui-clickable-element" onclick="triggerPOSOpen()" disabled>Walk left behind counter to Serve</button>
        </div>

        <div id="hud-dashboard">
            <div class="hud-box">
                <div class="title">Earnings</div>
                <div id="hud-cash" class="stat" style="color: #30d158;">$0.00</div>
            </div>
            <div class="hud-box">
                <div class="title">Items Served</div>
                <div id="hud-served" class="stat">0 items</div>
