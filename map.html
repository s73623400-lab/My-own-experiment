<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Cafe Simulator</title>
    <style>
        :root {
            --bg-floor: #e5d9c7;
            --counter-color: #6d4c41;
            --player-color: #2196f3;
            --customer-color: #e91e63;
            --station-color: #8d6e63;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
            display: flex;
        }

        /* Layout Windows */
        #game-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 2D Bird's-Eye Canvas View */
        #view-panel {
            flex: 1;
            position: relative;
            background-color: #2a2a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 4px solid #333;
        }

        #game-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        #game-header h2 { margin: 0; font-size: 1.2rem; color: #ffd700; }
        #score-display { font-size: 1.1rem; margin-top: 5px; }

        #cafe-floor {
            width: 600px;
            height: 500px;
            background-color: var(--bg-floor);
            background-image: radial-gradient(#d7ccc8 15%, transparent 16%), radial-gradient(#d7ccc8 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            position: relative;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* Static Layout Furniture Elements */
        .furniture {
            position: absolute;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: #fff;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #counter-register {
            top: 150px; left: 150px; width: 120px; height: 60px;
            background-color: var(--counter-color);
        }

        #brewing-station {
            top: 150px; left: 290px; width: 160px; height: 60px;
            background-color: var(--station-color);
            border-left: 2px solid #5d4037;
        }

        .dining-table {
            width: 70px; height: 70px; background-color: #a1887f; border-radius: 50%;
        }

        /* Dynamic Characters */
        #player-dot {
            position: absolute;
            width: 24px; height: 24px;
            background-color: var(--player-color);
            border: 3px solid #fff;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 5;
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.6);
            transform: translate(-12px, -12px);
        }

        #customer {
            position: absolute;
            width: 24px; height: 24px;
            background-color: var(--customer-color);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 4;
            top: 230px; left: 210px;
            display: none;
            box-shadow: 0 0 10px rgba(233, 30, 99, 0.6);
            transform: translate(-12px, -12px);
        }

        /* Order Speech bubble overhead */
        #order-bubble {
            position: absolute;
            top: 175px; left: 225px;
            background: white;
            color: black;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: none;
            z-index: 6;
            animation: bounce 2s infinite;
        }
        #order-bubble::after {
            content: ''; position: absolute; bottom: -5px; left: 15px;
            border-width: 5px 5px 0; border-style: solid; border-color: white transparent;
        }

        /* Right Dashboard Interface Panel */
        #ui-panel {
            width: 400px;
            background-color: #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
        }

        .panel-block {
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
        }

        .panel-title {
            margin-top: 0; margin-bottom: 15px; font-size: 1rem;
            text-transform: uppercase; tracking-letter: 1px; color: #bbb;
            border-bottom: 1px solid #444; padding-bottom: 5px;
        }

        /* Tablet Module UI */
        #tablet-screen {
            background: #151515;
            border: 6px solid #424242;
            border-radius: 12px;
            padding: 10px;
            min-height: 120px;
        }
        .ticket {
            background: #fff9c4; color: #333;
            padding: 10px; border-radius: 6px;
            font-family: monospace; font-size: 0.85rem;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }

        /* Interactive Crafting Station UI Controls */
        .ingredient-group {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px;
        }
        .btn-ing {
            background: #3e2723; color: white; border: 1px solid #5d4037;
            padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
        }
        .btn-ing:hover { background: #4e342e; }
        
        #crafting-pot {
            background: #111; border: 1px dashed #666; padding: 10px;
            border-radius: 4px; font-size: 0.85rem; color: #a1887f; min-height: 24px;
            margin-bottom: 10px; word-break: break-all;
        }

        .action-bar { display: flex; gap: 10px; }
        .btn-action {
            flex: 1; padding: 10px; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer; color: white;
        }
        #btn-serve { background: #4caf50; }
        #btn-trash { background: #f44336; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- LEFT PANEL: Point & Click 2D Floor Plan Layout -->
        <div id="view-panel">
            <div id="game-header">
                <h2>☕ System Map Sandbox</h2>
                <div id="score-display">Score: <b>0</b></div>
            </div>

            <div id="cafe-floor" onclick="movePlayer(event)">
                <!-- Static Counter and Espresso/Food Prep stations -->
                <div id="counter-register" class="furniture">Register</div>
                <div id="brewing-station" class="furniture">Kitchen Station</div>
                
                <!-- Table placements -->
                <div class="furniture dining-table" style="top:320px; left:100px;"></div>
                <div class="furniture dining-table" style="top:320px; left:380px;"></div>

                <!-- Live Game Actors -->
                <div id="player-dot"></div>
                <div id="customer"></div>
                <div id="order-bubble">"Hi! I'd like to order."</div>
            </div>
        </div>

        <!-- RIGHT PANEL: Handheld POS Tablet Controls & Crafting Interfaces -->
        <div id="ui-panel">
            <!-- Tablet Interface Area -->
            <div class="panel-block">
                <h3 class="panel-title">📱 Register/POS Tablet</h3>
                <div id="tablet-screen">
                    <div id="active-ticket" style="color: #666; text-align: center; padding-top: 30px;">
                        No pending tickets. Walk to register counter to take orders.
                    </div>
                </div>
            </div>

            <!-- Recipe Mixing Station Console Layout -->
            <div class="panel-block">
                <h3 class="panel-title">🛠️ Crafting Interface</h3>
                <div class="ingredient-group">
                    <button class="btn-ing" onclick="addIngredient('Espresso')">☕ Espresso</button>
                    <button class="btn-ing" onclick="addIngredient('Milk')">🥛 Steamed Milk</button>
                    <button class="btn-ing" onclick="addIngredient('Water')">💧 Hot Water</button>
                    <button class="btn-ing" onclick="addIngredient('Chocolate')">🍫 Choc Syrup</button>
                    <button class="btn-ing" onclick="addIngredient('Tea Leaves')">🍃 Tea Leaves</button>
                    <button class="btn-ing" onclick="addIngredient('Bakery Case')">🥐 Pastry Case</button>
                </div>
                <div style="font-size:0.75rem; color:#aaa; margin-bottom:4px;">Current Tray Mixture:</div>
                <div id="crafting-pot">Empty</div>
                <div class="action-bar">
                    <button id="btn-serve" class="btn-action" onclick="serveOrder()">Serve Order</button>
                    <button id="btn-trash" class="btn-action" onclick="clearTray()">Trash</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Gameplay State Loop Engine -->
    <script>
        // Game Logic State Registers
        let score = 0;
        let playerPos = { x: 0, y: 400 };
